<style>
.p1-cloze-line {line-height:2.7;overflow-wrap:anywhere}
.p1-cloze-input {display:inline-block;vertical-align:middle;width:7rem;max-width:35vw;padding:.4rem .55rem;margin:.15rem .25rem;border:1px solid #a9b4d3;border-radius:.55rem;background:white;color:#1f2b47;font:inherit}

#p1Feedback {display:block;flex:1;min-width:12rem;line-height:1.5;font-size:.9rem}

.study-topline {display:flex;align-items:center;justify-content:flex-end;min-height:2.75rem;gap:.5rem}

.study-top-actions .study-nav-btn {white-space:nowrap;min-width:0;max-width:9rem;padding:.55rem 1rem;font-size:clamp(.75rem,2.1vw,.92rem);flex:0 1 auto}
.study-topline #backBtn,.study-topline #favoriteBtn {display:none!important}

#p1MemorizeActions button {min-width:0;width:100%;white-space:nowrap;padding:.6rem .3rem;font-size:clamp(.72rem,2.1vw,.95rem);border-radius:.7rem}

.speaking-shell:has(#p1MemorizeActions:not(.hidden)) #revealBtn {display:none!important}
@media(max-width:420px) {

}

.memorize-box:has(#p1TypingArea:not(.hidden)) {
  display:block;min-width:0;width:100%;box-sizing:border-box;
}
#p1TypingArea:not(.hidden) {
  display:flex;flex-direction:column;align-items:stretch;gap:.65rem;
  flex:1 1 auto;min-width:0;width:100%;box-sizing:border-box;
}
#p1TypingArea textarea,
#p1DictationInput {
  display:block;box-sizing:border-box;width:100%;max-width:100%;

}
#p1TypingArea .p1-cloze-line {width:100%;min-width:0}

 #p1TypingArea textarea,#p1DictationInput {min-height:180px;padding:.85rem}
}
