<script>  /* S6.4 — ONE Memorize contract for Speaking Parts 1–4.
     Level 1: cloze; Level 2: listen and write the complete teacher model.
     All drafts and checks stay client-side: no Progress, Mastery or Sheet writes. */
  function speakingMemorizePlan_(answer){
    const pieces=String(answer||'').split(/([A-Za-z][A-Za-z'-]*)/g);
    let ordinal=0;
    const eligible=[],chosen=[];
    pieces.forEach(function(piece,i){
      if(!/^[A-Za-z][A-Za-z'-]*$/.test(piece))return;
      ordinal++;
      if(piece.length>2){
        eligible.push(i);
        if(ordinal%5===0)chosen.push(i);
      }
    });
    // Short answers must still have a useful, non-empty practice blank.
    if(!chosen.length&&eligible.length)chosen.push(eligible[Math.floor(eligible.length/2)]);
    const indices=new Set(chosen),parts=[],blanks=[];
    pieces.forEach(function(piece,i){
      if(indices.has(i)){parts.push({blank:true,answer:piece});blanks.push(piece);}
      else parts.push({blank:false,text:piece});
    });
    return {parts,blanks};
  }
  function speakingWordRecallScore_(answer,attempt){
    const target=String(answer||'').toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g)||[];
    const typed=String(attempt||'').toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g)||[];
    const counts=Object.create(null);target.forEach(function(x){counts[x]=(counts[x]||0)+1;});
    let hits=0;typed.forEach(function(x){if(counts[x]>0){counts[x]--;hits++;}});
    return Math.round(100*hits/Math.max(1,target.length));
  }
  function speakingNormalizeRecall_(value){
    return String(value||'').trim().toLowerCase().replace(/[^a-z0-9'-]/g,'');
  }
  function speakingRenderMemorize_(opts){
    const {container,answer:source,level:rawLevel,key,drafts,createAudio}=opts;
    const answer=String(source||'').trim(),level=Number(rawLevel)===2?2:1;
    container.replaceChildren();
    const panel=document.createElement('div');panel.className='speaking-memorize-panel';
    const hint=document.createElement('p');hint.className='p2-memory-hint speaking-memorize-hint';
    hint.textContent=level===1?'Fill in the missing words.':'Listen and write the full answer.';
    panel.appendChild(hint);
    const inputs=[];let dictation=null;
    if(level===2){
      if(typeof createAudio==='function'){
        const group=createAudio();
        if(group)panel.appendChild(group);
      }
      dictation=document.createElement('textarea');
      dictation.className='p2-dictation speaking-memorize-dictation';
      dictation.rows=6;dictation.spellcheck=false;
      dictation.setAttribute('aria-label','Write the full answer you hear');
      dictation.placeholder='Write the full answer here...';
      dictation.value=typeof drafts[key]==='string'?drafts[key]:'';
      dictation.addEventListener('input',()=>{drafts[key]=dictation.value;});
      panel.appendChild(dictation);
    }else{
      const line=document.createElement('div');line.className='p2-cloze-line speaking-memorize-cloze';
      const plan=speakingMemorizePlan_(answer);let n=0;
      const stored=drafts[key]&&typeof drafts[key]==='object'?drafts[key]:{};
      plan.parts.forEach(function(piece){
        if(!piece.blank){line.appendChild(document.createTextNode(piece.text));return;}
        const index=n++,input=document.createElement('input');
        input.type='text';input.className='p1-cloze-input';input.placeholder='_____';
        input.autocomplete='off';input.spellcheck=false;
        input.setAttribute('aria-label','Missing word '+(index+1));
        input.value=stored[index]||'';
        input.addEventListener('input',()=>{
          if(!drafts[key]||typeof drafts[key]!=='object')drafts[key]={};
          drafts[key][index]=input.value;
          input.classList.remove('p1-cloze-correct','p1-cloze-wrong');
        });
        line.appendChild(input);inputs.push({input,expected:piece.answer});
      });
      panel.appendChild(line);
    }
    const actions=document.createElement('div');
    actions.className='p2-memory-actions speaking-memorize-actions';
    const check=document.createElement('button');check.type='button';check.className='primary-btn';check.textContent='Check';
    const retry=document.createElement('button');retry.type='button';retry.className='secondary-btn';retry.textContent='Try again';
    const show=document.createElement('button');show.type='button';show.className='secondary-btn';show.textContent='Show answer';show.setAttribute('aria-expanded','false');
    const feedback=document.createElement('p');feedback.className='speaking-memorize-feedback';feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');
    const revealed=document.createElement('section');revealed.className='speaking-memorize-revealed';revealed.hidden=true;
    const answerLabel=document.createElement('strong');answerLabel.textContent='Teacher model answer';
    const full=document.createElement('p');full.className='model-text';full.textContent=answer;
    revealed.append(answerLabel,full);
    check.addEventListener('click',()=>{
      if(level===2){
        const value=dictation.value.trim();
        feedback.textContent=value?'Word recall: '+speakingWordRecallScore_(answer,value)+'%. Compare word order and meaning with the teacher model.':'Write an answer first.';
        return;
      }
      let correct=0;
      inputs.forEach(function(entry){
        const ok=speakingNormalizeRecall_(entry.input.value)===speakingNormalizeRecall_(entry.expected);
        entry.input.classList.toggle('p1-cloze-correct',ok);
        entry.input.classList.toggle('p1-cloze-wrong',!ok);
        if(ok)correct++;
      });
      feedback.textContent=correct+'/'+inputs.length+' words correct.';
    });
    retry.addEventListener('click',()=>{
      delete drafts[key];
      if(dictation)dictation.value='';
      inputs.forEach(function(entry){
        entry.input.value='';
        entry.input.classList.remove('p1-cloze-correct','p1-cloze-wrong');
      });
      feedback.textContent='';revealed.hidden=true;show.setAttribute('aria-expanded','false');
      const first=dictation||(inputs[0]&&inputs[0].input);if(first)first.focus();
    });
    show.addEventListener('click',()=>{
      revealed.hidden=false;show.setAttribute('aria-expanded','true');
    });
    actions.append(check,retry,show);
    panel.append(actions,feedback,revealed);
    container.appendChild(panel);
    return panel;
  }
  window.AptisSpeakingMemorize=Object.freeze({
    plan:speakingMemorizePlan_,recallScore:speakingWordRecallScore_,
    normalize:speakingNormalizeRecall_,render:speakingRenderMemorize_
  });

</script>
