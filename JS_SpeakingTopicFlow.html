<script>  function switchPart(part, keepHome) {
    state.activePart = [1,2,3].includes(Number(part)) ? Number(part) : 1;
    writeLocal('aptisActivePart', String(state.activePart));
    // Navigation can run before asynchronous bootstrap has finished.
    // Never read part1/part2/part3 from null; keep a visible loading state.
    if (!isValidBootstrap(state.data)) {
      state.items = [];
      state.currentPrompt = 1;
      $$('.part-tab[data-part]').forEach(btn => btn.classList.toggle('active', Number(btn.dataset.part) === state.activePart));
      $('skillHomeView').classList.add('hidden');
      $('homeView').classList.add('hidden');
      $('studyView').classList.add('hidden');
      $('progressView').classList.add('hidden');
      setLoadingVisible(true);
      setSyncStatus('Loading Speaking data…', 'syncing');
      if (!state.refreshing) loadData({ force: true, blocking: true });
      return;
    }
    state.items = state.activePart === 3 ? state.data.part3 : (state.activePart === 2 ? state.data.part2 : state.data.part1);
    state.currentPrompt = 1;
    state.quickQueue = [];
    state.quickPosition = -1;

    $$('.part-tab[data-part]').forEach(btn => btn.classList.toggle('active', Number(btn.dataset.part) === state.activePart));
    updatePartCopy();
    renderSummary();
    renderList();
    renderProgressDashboard();
    setActiveNav(state.activePart === 3 ? 'part3' : (state.activePart === 2 ? 'part2' : 'part1'));

    if (!keepHome) showPartHome();
  }

  function updatePartCopy() {
    if (state.activePart === 1) {
      $('heroPill').textContent = 'Speaking Part 1';
      $('heroTitle').textContent = 'Small practice. Stronger answers.';
      $('heroText').textContent = 'Build the core sentence first, then speak naturally for 30 seconds.';
      $('libraryTitle').textContent = '29 personal questions';
      $('progressLabel').textContent = 'mastered';
    } else if (state.activePart === 2) {
      $('heroPill').textContent = 'Speaking Part 2';
      $('heroTitle').textContent = 'See it. Structure it. Speak for 45 seconds.';
      $('heroText').textContent = 'Practise picture description and two related questions, 45 seconds for each answer.';
      $('libraryTitle').textContent = (state.items.length || 0) + ' photo topics';
      $('progressLabel').textContent = 'topics mastered';
    } else {
      $('heroPill').textContent = 'Speaking Part 3';
      $('heroTitle').textContent = 'Compare clearly. Explain naturally.';
      $('heroText').textContent = 'Compare two pictures, then answer two related questions. 45 seconds per response.';
      $('libraryTitle').textContent = (state.items.length || 0) + ' comparison topics';
      $('progressLabel').textContent = 'topics mastered';
    }
  }

  function computeSummary() {
    let learned = 0, due = 0, favorite = 0, weak = 0;
    state.items.forEach(item => {
      const p = item.progress || {};
      if (p.status === 'learned') learned++;
      if (p.favorite) favorite++;
      if (isDue(p)) due++;
      if (Number(p.reviewCount || 0) > 0 && Number(p.rating || 0) > 0 && Number(p.rating || 0) <= 2) weak++;
    });
    return { learned, due, favorite, weak, percent: state.items.length ? Math.round(learned / state.items.length * 100) : 0 };
  }

  function renderSummary() {
    const s = computeSummary();
    $('learnedCount').textContent = s.learned;
    $('dueCount').textContent = s.due;
    $('favoriteCount').textContent = s.favorite;
    $('weakCount').textContent = s.weak;
    $('progressPct').textContent = s.percent + '%';
    $('progressRing').style.background = 'conic-gradient(var(--primary) ' + (s.percent * 3.6) + 'deg, #e7ebf3 0deg)';
    $('reviewDueBtn').textContent = s.due ? 'Review ' + s.due + ' due →' : 'Review plan →';
  }

  function renderList() {
    const list = $('questionList');
    const filter = $('filterSelect').value;
    const query = normalize($('searchInput').value);
    list.innerHTML = '';

    let visible = 0;
    state.items.forEach((item, index) => {
      const p = item.progress || {};
      const searchable = state.activePart === 1 ? item.question : [item.topic].concat(item.questions || []).join(' ');

      if (query && normalize(searchable).indexOf(query) < 0) return;
      if (!matchesFilter(p, filter)) return;
      visible++;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'question-item' + (state.activePart >= 2 ? ' part2-card' : '');
      btn.addEventListener('click', () => openItem(index));

      const num = document.createElement('div');
      if (state.activePart >= 2) {
        num.className = 'topic-thumb';
        const thumbUrl = state.activePart === 3 ? resolveImageAssetUrl(item.imageA) : resolveImageUrl(item);
        if (thumbUrl) {
          num.style.backgroundImage = 'url("' + thumbUrl.replace(/"/g, '%22') + '")';
          num.setAttribute('aria-label', state.activePart === 3 ? ((item.imageA && item.imageA.imageAlt) || item.topic || 'Topic image') : (item.imageAlt || item.topic || 'Topic image'));
        } else {
          num.classList.add('fallback');
          num.textContent = state.activePart === 3 ? ((item.imageA && item.imageA.sceneIcon) || '🖼️') : (item.sceneIcon || '🖼️');
        }
      } else {
        num.className = 'qnum';
        num.textContent = String(index + 1).padStart(2, '0');
      }

      const body = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'qtext';
      title.textContent = state.activePart === 1 ? item.question : item.topic;

      const meta = document.createElement('div');
      meta.className = 'qmeta';
      if (state.activePart === 1) {
        meta.textContent = item.tense || 'Speaking Part 1';
      } else {
        const mastered = Number(p.masteredPrompts || 0);
        const totalPrompts = Number(p.totalPrompts || ((item.promptProgress || []).length || 1));
        meta.textContent = mastered + '/' + totalPrompts + (totalPrompts === 1 ? ' response mastered · 45 seconds' : ' responses mastered · 45 seconds each');
        const dots = document.createElement('div');
        dots.className = 'topic-progress';
        (item.promptProgress || []).forEach(pp => {
          const d = document.createElement('span');
          d.className = 'prompt-dot ' + (pp.status === 'learned' ? 'done' : (pp.status === 'learning' ? 'learning' : ''));
          dots.appendChild(d);
        });
        meta.appendChild(dots);
      }
      body.appendChild(title); body.appendChild(meta);

      const right = document.createElement('div');
      right.innerHTML = '<div class="status-dot ' + escapeHtml(p.status || 'new') + '"></div>' + (p.favorite ? '<div class="qfav">★</div>' : '');

      btn.appendChild(num); btn.appendChild(body); btn.appendChild(right);
      list.appendChild(btn);
    });

    if (!visible) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No practice items match this filter.';
      list.appendChild(empty);
    }
  }

  function matchesFilter(p, filter) {
    if (filter === 'all') return true;
    if (filter === 'new') return (p.status || 'new') === 'new';
    if (filter === 'learning') return p.status === 'learning';
    if (filter === 'learned') return p.status === 'learned';
    if (filter === 'due') return isDue(p);
    if (filter === 'weak') return Number(p.reviewCount || 0) > 0 && Number(p.rating || 0) > 0 && Number(p.rating || 0) <= 2;
    if (filter === 'favorite') return Boolean(p.favorite);
    return true;
  }

  function openItem(index) {
    state.currentIndex = clamp(index, 0, state.items.length - 1);
    state.currentPrompt = 1;
    state.currentMode = 'learn';
    state.memorizeLevel = 1;
    stopSpeech();
    stopTimer(true);

    $('skillHomeView').classList.add('hidden');
    $('homeView').classList.add('hidden');
    $('studyView').classList.remove('hidden');
    renderCurrentItem();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function renderCurrentItem() {
    const item = currentItem();
    if (!item) return;

    const p = item.progress || {};
    $('statusBadge').textContent = statusLabel(p.status);
    $('favoriteBtn').textContent = p.favorite ? '★' : '☆';
    $('favoriteBtn').classList.toggle('active', Boolean(p.favorite));

    const isP2 = state.activePart === 2;
    const isP3 = state.activePart === 3;
    const multi = state.activePart >= 2;
    $('part2Visual').classList.toggle('hidden', !isP2);
    $('part3Visual').classList.toggle('hidden', !isP3);
    $('promptStepper').classList.toggle('hidden', !multi || isP2 || isP3);
    if (multi) {
      const prompts = Array.isArray(item.questions) ? item.questions : [];
      $$('.prompt-step').forEach(function(btn) {
        const n = Number(btn.dataset.prompt);
        btn.disabled = n > prompts.length || !String(prompts[n-1] || '').trim();
      });
      renderPromptStepper();
    }
    $('part2FrameworkBlock').classList.toggle('hidden', !isP2);
    $('part3FrameworkBlock').classList.toggle('hidden', !isP3);
    $('part1Hints').classList.toggle('hidden', multi);
    $('part1FrameworkBlock').classList.toggle('hidden', multi);
    $('coreBlock').classList.add('hidden');

    if (isP2) {
      $('questionNumber').textContent = 'Part 2 · Topic ' + (state.currentIndex + 1) + '/' + state.items.length;
      renderPart2Image(item);
      renderSharedFormulaText($('part2MustSay'),item.mustSay || '');
      renderSharedFormulaText($('part2SayMore'),item.sayMore || '');
      $('fullAnswerLabel').textContent = 'Full 45-second answer';
      $('structureBlock').classList.remove('hidden');
    } else if (isP3) {
      $('questionNumber').textContent = 'Part 3 · Topic ' + (state.currentIndex + 1) + '/' + state.items.length;
      renderPart3Images(item);
      $('part3ComparisonAxis').textContent = item.comparisonAxis || item.commonPoint || '';
      $('part3Common').textContent = item.mustCommon || '';
      $('part3PictureA').textContent = item.mustPictureA || '';
      $('part3PictureB').textContent = item.mustPictureB || '';
      $('part3Difference').textContent = item.mustDifference || '';
      $('part3SayMore').textContent = item.sayMore || '';
      $('fullAnswerLabel').textContent = 'Full 45-second answer';
      $('structureBlock').classList.remove('hidden');
    } else {
      $('questionNumber').textContent = 'Part 1 · Question ' + (state.currentIndex + 1) + '/' + state.items.length;
      $('tenseSignal').textContent = item.tenseSignal || '—';
      $('tenseName').textContent = item.tense || '—';
      $('coreAnswer').textContent = item.core || '';
      $('answerTypeBadge').textContent = item.answerType || 'Focus → Expand → Reason';
      $('focusAnswer').textContent = item.focus || item.core || '';
      $('expandAnswer').textContent = item.expand || '';
      $('reasonAnswer').textContent = item.reason || '';
      $('fullAnswerLabel').textContent = 'Full 30-second answer';
      $('structureBlock').classList.add('hidden');
    }

    renderPromptContent();
    setMode('shadow');
    setMemorizeLevel(1);
    syncFooter();
  }

  function renderPart2Image(item) {
    $('sceneIcon').textContent = item.sceneIcon || '🖼️';
    $('imageAlt').textContent = item.imageAlt || item.topic || 'Speaking Part 2 practice image';
    const url = resolveImageUrl(item);
    const img = $('sceneImage');
    const placeholder = $('imagePlaceholder');

    img.onerror = function() {
      img.classList.add('hidden');
      placeholder.classList.remove('hidden');
    };

    if (url) {
      img.src = url;
      img.alt = item.imageAlt || item.topic || '';
      img.classList.remove('hidden');
      placeholder.classList.add('hidden');
    } else {
      img.removeAttribute('src');
      img.classList.add('hidden');
      placeholder.classList.remove('hidden');
    }
  }

  function resolveImageUrl(item) {
    if (item.imageUrl && /^https?:\/\//i.test(item.imageUrl)) return item.imageUrl;
    if (item.imageDriveId) return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(item.imageDriveId) + '&sz=w1200';
    return '';
  }

  function resolveImageAssetUrl(asset) {
    if (!asset) return '';
    if (asset.imageUrl && /^https?:\/\//i.test(asset.imageUrl)) return asset.imageUrl;
    if (asset.imageDriveId) return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(asset.imageDriveId) + '&sz=w1200';
    return '';
  }

  function renderPart3Images(item) {
    renderCompareImage('A', item.imageA || {});
    renderCompareImage('B', item.imageB || {});
  }

  function renderCompareImage(slot, asset) {
    const img = $('p3Image' + slot);
    const ph = $('p3Placeholder' + slot);
    $('p3Icon' + slot).textContent = asset.sceneIcon || '🖼️';
    $('p3Alt' + slot).textContent = asset.imageAlt || 'Comparison image';
    const url = resolveImageAssetUrl(asset);
    img.onerror = function() { img.classList.add('hidden'); ph.classList.remove('hidden'); };
    if (url) {
      img.src = url; img.alt = asset.imageAlt || ''; img.classList.remove('hidden'); ph.classList.add('hidden');
    } else {
      img.removeAttribute('src'); img.classList.add('hidden'); ph.classList.remove('hidden');
    }
  }

  function renderPromptStepper() {
    const labels = state.activePart === 3
      ? ['1 · Describe both', '2 · Compare', '3 · Opinion']
      : ['1 · Describe', '2 · Experience', '3 · Opinion'];
    $$('.prompt-step').forEach((btn, i) => {
      btn.classList.toggle('active', Number(btn.dataset.prompt) === state.currentPrompt);
      btn.textContent = labels[i] || btn.textContent;
    });
  }

  function setPrompt(n) {
    if (state.activePart < 2) return;
    const item = currentItem();
    const maxPrompts = Math.max(1, (item && item.questions ? item.questions.length : 1));
    state.currentPrompt = clamp(n, 1, maxPrompts);
    stopSpeech();
    stopTimer(true);
    renderPromptStepper();
    renderPromptContent();
    setMode('shadow');
  }

  // Shared B1 formula markers; reusable language across Speaking / Writing.
  const SHARED_B1_FORMULAS = [
    'I would like to talk about','The main reason is that','In my opinion,',
    'For example,','After that,','In the end,','Overall, I think',
    'I usually','I think','I felt','I feel','I like it because',
    'There is','There are','However,','This helps me','I enjoy',
    'Last weekend,','Yesterday,','My favorite','My hometown',
    'I am planning to','In the picture, I can see','The picture shows','In the background,','On the left,','On the right,','They appear to be','It looks like','I can also see','The person appears to be'
  ].sort((a,b)=>b.length-a.length);
  function renderSharedFormulaText(el,raw) {
    const str=String(raw||'');
    const found=[];
    SHARED_B1_FORMULAS.forEach(phrase=>{
      const lower=str.toLowerCase(),needle=phrase.toLowerCase();
      let pos=0;
      while(true){
        const ix=lower.indexOf(needle,pos);
        if(ix<0)break;
        const previous=str.slice(0,ix).trimEnd();
        if((!previous||/[.!?]$/.test(previous))&&!found.some(a=>ix<a.end&&ix+phrase.length>a.start))
          found.push({start:ix,end:ix+phrase.length});
        pos=ix+phrase.length;
      }
    });
    found.sort((a,b)=>a.start-b.start);
    el.replaceChildren();
    let pos=0;
    found.forEach(m=>{
      el.appendChild(document.createTextNode(str.slice(pos,m.start)));
      const b=document.createElement('strong');b.className='p1-shared-formula';b.textContent=str.slice(m.start,m.end);el.appendChild(b);
      pos=m.end;
    });
    el.appendChild(document.createTextNode(str.slice(pos)));
  }
  function renderPromptContent() {
    const item = currentItem();
    if (!item) return;

    $('questionText').textContent = [2,3].includes(state.activePart) && state.currentMode!=='test' ? 'Practise all three questions in this topic' : currentQuestionText();
    if(state.activePart<=2) renderSharedFormulaText($('modelAnswer'),currentModel());
    else $('modelAnswer').textContent = currentModel();
    $('structureText').textContent = currentStructure();
    renderKeywords(currentKeywords());
    renderShadow();
    renderMemorize();
    resetTimerDisplay();

    // S6.3: the common timer is self-explanatory. Keep the duration at its
    // authoritative per-Part/per-Q source, not duplicated in UI instructions.
    $('startTimerBtn').textContent = '▶ Start speaking';
    $('showAnswerAfterTest').textContent = 'Show model answer';
    $('showAnswerAfterTest').disabled = false;
  }

  function renderKeywords(text) {
    const box = $('keywords');
    box.innerHTML = '';
    splitKeywords(text).forEach(k => {
      const chip = document.createElement('span');
      chip.className = 'keyword-chip';
      chip.textContent = k;
      box.appendChild(chip);
    });
  }

</script>
