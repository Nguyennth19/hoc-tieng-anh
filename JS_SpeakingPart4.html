<script>
(function(){
'use strict';
const byId=id=>document.getElementById(id);
const S={data:null,current:null,mode:'learn',phase:'ready',deadline:0,timer:null,spoken:0,session:null,saved:false,requestSeq:0};
const qs=(sel,root=document)=>root.querySelector(sel);
const duration=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function stopClock(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
function status(message){byId('p4Status').textContent=message;}
function topicLabel(x){const t=String(x.topic||x.questions?.[0]||'').trim();return t.length>94?t.slice(0,91)+'…':t||'Untitled topic';}
function renderClock(){const sec=Math.max(0,Math.ceil((S.deadline-Date.now())/1000));byId('p4Time').textContent=duration(sec);if(sec===0){stopClock();if(S.phase==='prep'){startSpeaking();}else if(S.phase==='speak'){endSpeaking();}}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clock(phase,seconds){stopClock();S.phase=phase;S.deadline=Date.now()+seconds*1000;byId('p4Time').textContent=duration(seconds);byId('p4Stage').textContent=phase==='prep'?'Preparation':phase==='speak'?'Speaking':'Ready';S.timer=setInterval(renderClock,200);byId('p4Begin').disabled=true;byId('p4Next').disabled=phase!=='prep';byId('p4Stop').disabled=false;}
function startSpeaking(){S.session='p4_'+Date.now()+'_'+Math.random().toString(36).slice(2,12);S.saved=false;clock('speak',120);status('Speaking: answer all three questions within the same 120-second window.');}
function endSpeaking(){if(S.phase==='speak')S.spoken=Math.max(0,Math.min(120,120-Math.ceil((S.deadline-Date.now())/1000)));stopClock();S.phase='done';byId('p4Review').hidden=!(S.current&&S.session);byId('p4Stage').textContent='Finished';byId('p4Begin').disabled=false;byId('p4Next').disabled=true;byId('p4Stop').disabled=true;status('Practice finished. Rate your performance and save your practice attempt below. Audio recording is not enabled.');}
/** Highlight only approved reusable language patterns, not topic-specific details. */
const P4_FIXED_PHRASES=[
'I would like to talk about a time when','The main reason is that',
'One thing I remember clearly is that','Overall, I think','What matters most is',
'At that time,','At first,','In the end,','For example,','After that,',
'To be honest,','In my opinion,','However,','Luckily,','I think',
'I felt','I believe','We should','People should'
].sort((a,b)=>b.length-a.length);
function p4FormulaHtml(raw){
 const text=String(raw||'');
 const matches=[];
 for(const phrase of P4_FIXED_PHRASES){
   let from=0;
   while(from<text.length){
     const ix=text.toLowerCase().indexOf(phrase.toLowerCase(),from);
     if(ix<0)break;
     const before=ix===0?' ':text[ix-1],after=text[ix+phrase.length]||' ';
     if(!/[A-Za-z]/.test(before)&&!/[A-Za-z]/.test(after)&&matches.every(m=>ix+phrase.length<=m.start||ix>=m.end)){
       matches.push({start:ix,end:ix+phrase.length});
     }
     from=ix+phrase.length;
   }
 }
 matches.sort((a,b)=>a.start-b.start);
 let out='',at=0;
 for(const m of matches){
   out+=escapeHtml(text.slice(at,m.start));
   out+='<strong class="p4-fixed-formula">'+escapeHtml(text.slice(m.start,m.end))+'</strong>';
   at=m.end;
 }
 return out+escapeHtml(text.slice(at));
}
function renderSet(){
  if(!S.data)return;
  byId('p4Save').disabled=false;
  S.current=S.data.sets.find(x=>x.id===byId('p4Set').value)||S.data.sets[0]||null;
  stopClock();S.phase='ready';S.session=null;S.saved=false;byId('p4Review').hidden=true;byId('p4Saved').textContent='';byId('p4Stage').textContent='Ready';byId('p4Time').textContent='01:00';
  byId('p4Begin').disabled=!S.current;byId('p4Next').disabled=true;byId('p4Stop').disabled=true;
  if(!S.current){byId('p4Content').textContent='No approved exam sets are available. Use Learn mode for drafts.';byId('p4Models').textContent='';return;}
  byId('p4Content').innerHTML=S.current.questions.map((q,i)=>{
    const answer=S.mode==='learn'&&S.current.models?S.current.models[i]:'';
    return '<article class="p4dev-question"><b>Q'+(i+1)+'</b><p class="p4dev-prompt">'+escapeHtml(q)+'</p>'+
      (answer?'<details class="p4dev-inline-answer"><summary>Study answer (draft) · Q'+(i+1)+'</summary><p>'+escapeHtml(answer)+'</p></details>':'')+'</article>';
  }).join('');
  byId('p4Models').textContent='';
  status(S.mode==='learn'?'Study draft · QA status: '+S.current.qaStatus:'Approved test set.');
}
function load(){
  const requestId=++S.requestSeq;
  stopClock();S.session=null;byId('p4Review').hidden=true;S.mode=byId('p4Mode').value;status('Loading Part 4 data...');
  byId('p4Content').textContent='';
  if(typeof google==='undefined'||!google.script||!google.script.run){status('Google Apps Script runtime is not connected.');return;}
  google.script.run.withSuccessHandler(data=>{
    if(requestId!==S.requestSeq)return;
    if(!data||data.isDev!==true){status('Safety check failed: DEV response required.');return;}
    S.data=data;
    const select=byId('p4Set');select.replaceChildren();
    data.sets.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=topicLabel(x)+(x.qaStatus==='QA_HOLD'?' · QA hold':'');o.title=x.id+' · '+String(x.questions?.[0]||'');select.appendChild(o);});
    renderSet();
    if(S.mode==='exam'&&data.sets.length===0)status('Exam mode locked: no QA-approved sets. All source drafts remain available in Learn mode.');
  }).withFailureHandler(error=>{if(requestId===S.requestSeq)status('DEV not configured: '+(error?.message||'Unable to load data'));}).getSpeakingPart4Dev(S.mode);
}

function refreshPart4Progress(){
  const el=byId('p4ProgressStatus');if(!el)return;
  el.textContent='Loading Part 4 progress…';
  if(typeof google==='undefined'||!google.script?.run)return;
  google.script.run.withSuccessHandler(rows=>{
    const items=Array.isArray(rows)?rows:[];
    const mastered=items.filter(x=>x.status==='learned').length;
    const due=items.filter(x=>x.nextReview&&new Date(x.nextReview)<=new Date()).length;
    const reviews=items.reduce((n,x)=>n+(Number(x.reviewCount)||0),0);
    const total=51;
    const pct=Math.round(100*mastered/total);
    byId('p4ProgressPct').textContent=pct+'%';
    byId('p4ProgressBar').style.width=pct+'%';
    byId('p4Learned').textContent=mastered;
    byId('p4Due').textContent=due;
    byId('p4Reviews').textContent=reviews;
    el.textContent=items.length+' of '+total+' topics practised · tracked separately from Parts 1–3.';
  }).withFailureHandler(err=>{el.textContent='Part 4 progress unavailable: '+(err?.message||'check connection');}).getSpeakingPart4DevProgress();
}
function open(){
  const el=byId('speakingPart4Future');if(!el)return;
  el.classList.remove('hidden');
  const shell=qs('.speaking-shell');if(shell)shell.classList.add('p4-mode');
  document.querySelectorAll('.bottom-nav .nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav==='part4'));
  window.scrollTo(0,0);load();
}
function close(){++S.requestSeq;stopClock();S.session=null;S.phase='ready';byId('speakingPart4Future').classList.add('hidden');const shell=qs('.speaking-shell');if(shell)shell.classList.remove('p4-mode');
  document.querySelectorAll('.bottom-nav .nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav==='home'));}
document.addEventListener('DOMContentLoaded',()=>{
 const card=qs('.speaking-module-card.is-coming');
 if(card&&/Part 4/.test(card.textContent)){card.disabled=false;card.classList.remove('is-coming');const label=qs('.module-status',card);if(label)label.textContent='DEV preview';card.addEventListener('click',open);}
 byId('p4Close').addEventListener('click',close);
 byId('p4ProgressOpen')?.addEventListener('click',open);
 document.querySelectorAll('.bottom-nav [data-nav="progress"]').forEach(x=>x.addEventListener('click',()=>setTimeout(refreshPart4Progress,20)));
 byId('progressBtn')?.addEventListener('click',()=>setTimeout(refreshPart4Progress,20));
 document.querySelectorAll('.bottom-nav .nav-btn').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav==='part4'){open();}else if(!byId('speakingPart4Future').classList.contains('hidden')){close();}},true));
 byId('p4Mode').addEventListener('change',load);
 byId('p4Load').addEventListener('click',load);
 byId('p4Set').addEventListener('change',renderSet);
 byId('p4Begin').addEventListener('click',()=>{if(S.current)clock('prep',60);});
 byId('p4Next').addEventListener('click',()=>{if(S.phase==='prep')startSpeaking();});
 byId('p4Stop').addEventListener('click',endSpeaking);

 byId('p4Save').addEventListener('click',()=>{
   if(!S.current||!S.session||S.saved||S.phase!=='done')return;
   const setId=S.current.id,sessionId=S.session,mode=S.mode;
   byId('p4Save').disabled=true;byId('p4Saved').textContent='Saving Part 4 progress...';
   google.script.run.withSuccessHandler(result=>{
     if(S.session!==sessionId||S.current?.id!==setId)return;
     S.saved=true;refreshPart4Progress();byId('p4Saved').textContent='Saved Part 4 attempt '+(result.attemptId||'')+'.';byId('p4Save').disabled=false;
   }).withFailureHandler(err=>{
     if(S.session!==sessionId)return;
     byId('p4Save').disabled=false;byId('p4Saved').textContent='Save failed: '+(err&&err.message?err.message:'unknown error');
   }).saveSpeakingPart4DevAttempt({
     questionId:setId,clientSessionId:sessionId,elapsedSeconds:S.spoken,
     selfRating:Number(byId('p4Rating').value),note:byId('p4Note').value,mode
   });
 });
 byId('p4Read').addEventListener('click',()=>{
   google.script.run.withSuccessHandler(items=>{
     const p=items.find(x=>x.questionId===S.current?.id);
     byId('p4Saved').textContent=p?'Saved: '+p.status+', rating '+p.rating+', reviews '+p.reviewCount:'No saved progress for this set.';
   }).withFailureHandler(e=>byId('p4Saved').textContent='Progress check failed: '+e.message).getSpeakingPart4DevProgress();
 });

});
window.AptisSpeakingPart4={open,close};
})();
</script>
