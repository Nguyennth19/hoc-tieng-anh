<style>

  --green:#49b26f;

  --gold:#d6aa19;

}

.topbar h1{margin:1px 0 0;font-size:18px;font-weight:900;letter-spacing:-.025em}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.13em;color:#8a94a7}.top-actions{gap:7px}

.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius-xl);padding:24px;box-shadow:var(--shadow)}.loading-panel{display:flex;align-items:center;justify-content:center;gap:14px;min-height:190px}.loading-panel p{margin:4px 0 0;color:var(--muted)}.spinner{width:30px;height:30px;border:3px solid #e0e4ed;border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* Home hero */
.welcome-card{background:linear-gradient(135deg,#fff 0%,#fbfaff 56%,#efecff 100%);border:1px solid #ded9fb;border-radius:28px;padding:26px;display:grid;grid-template-columns:1fr auto;gap:26px;align-items:center;box-shadow:var(--shadow)}

.today-section,.library-section{margin-top:24px}.section-title-row{justify-content:space-between;gap:16px;margin-bottom:12px}.section-title-row h3{margin:2px 0 0;font-size:22px;font-weight:900;letter-spacing:-.025em}.section-note{margin:5px 0 0;color:var(--muted);font-size:12px}
.focus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.focus-card{min-height:128px;text-align:left;padding:15px;border-radius:18px;border:1px solid var(--border);background:#fff;color:var(--ink);box-shadow:var(--shadow-soft);transition:.12s ease}.focus-card:nth-child(1){background:var(--blue-soft);border-color:#d8e7ff}.focus-card:nth-child(2){background:var(--rose-soft);border-color:#f3dce3}.focus-card:nth-child(3){background:var(--gold-soft);border-color:#f0df97}.focus-card:nth-child(4){background:var(--green-soft);border-color:#d6eedf}.focus-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.8);margin-bottom:13px;font-weight:900}.focus-card strong{display:block;font-size:28px;letter-spacing:-.04em}.focus-card>span:last-child{display:block;color:#697386;font-size:12px;margin-top:1px;font-weight:700}

.question-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.question-item{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;text-align:left;align-items:start;min-height:90px;padding:14px;border:1px solid var(--border);border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(48,68,124,.035);transition:.12s ease}.question-item:hover{border-color:#d5cff7;box-shadow:0 8px 20px rgba(48,68,124,.07)}.qnum{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#f0effb;font-size:12px;font-weight:900;color:#6b60d8}.qtext{font-weight:800;line-height:1.42}.qmeta{color:var(--muted);font-size:11px;margin-top:5px}.qfav{color:#d6a20b;font-size:18px;line-height:1}.status-dot{width:9px;height:9px;border-radius:50%;margin-top:7px;background:#c9d0dc}.status-dot.learning{background:#efa93b}.status-dot.learned{background:var(--green)}.empty-state{grid-column:1/-1;padding:34px;text-align:center;color:var(--muted);border:1px dashed #ccd4e2;border-radius:18px;background:rgba(255,255,255,.56)}

}.memorize-levels,.speed-buttons{display:flex;gap:7px;flex-wrap:wrap}.level-btn,.speed-btn{min-height:42px;border:1px solid var(--border);background:#fff;color:var(--muted);padding:8px 12px;border-radius:12px;font-weight:850}.level-btn.active,.speed-btn.active{background:var(--purple-soft);border-color:#d8d0ff;color:#5f55e6}.memorize-box{min-height:145px;display:flex;align-items:center}.test-box{border-radius:21px;padding:24px;text-align:center;background:linear-gradient(180deg,#fff,#f5f4ff);border:1px solid #dfdaf8}.timer{font-size:clamp(58px,11vw,82px);font-weight:900;letter-spacing:-.065em;font-variant-numeric:tabular-nums;margin-top:6px}.timer-bar{height:9px;border-radius:999px;background:#e6e8ef;border:1px solid #dfe2e8;overflow:hidden;margin:13px auto;max-width:460px}.timer-bar-fill{width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--purple),#9b8eff);transition:width .2s linear}.test-instruction,.helper-text{color:var(--muted);line-height:1.55}.test-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.rating-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:11px 0 5px}.rating-btn{min-height:68px;border:1px solid var(--border);border-radius:14px;background:#fff;color:var(--ink);padding:8px}.rating-btn span,.rating-btn small{display:block}.rating-btn span{font-weight:900}.rating-btn small{color:var(--muted);margin-top:3px;font-size:10px}.rating-btn.strong{border-color:#c7e7d3;background:var(--green-soft);color:#2d8d54}.study-footer{justify-content:space-between;gap:8px;border-top:1px solid var(--border);margin-top:18px;padding-top:15px}

/* Bottom navigation */

.sheet-backdrop{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(39,49,77,.33);padding:12px}.bottom-sheet{width:min(100%,620px);background:#fff;border-radius:25px 25px 18px 18px;padding:12px 20px 22px;box-shadow:0 -18px 60px rgba(48,68,124,.2)}.sheet-handle{width:42px;height:4px;background:#d3d8e2;border-radius:999px;margin:0 auto 12px}.sheet-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.sheet-heading h3{margin:3px 0 0}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--border)}.setting-row.vertical{align-items:stretch;flex-direction:column;gap:8px}.setting-row span strong,.setting-row span small{display:block}.setting-row span small{color:var(--muted);margin-top:3px}.toast{position:fixed;left:50%;bottom:88px;z-index:100;transform:translateX(-50%);max-width:calc(100% - 28px);padding:11px 14px;border-radius:13px;background:#27314d;color:#fff;box-shadow:var(--shadow);font-size:13px}

/* V3D 3.2.1 loader + cache hotfix */
#loadingView[hidden], #loadingView.hidden { display:none !important; }
.sync-status{font-size:12px;color:var(--muted);min-width:0;white-space:nowrap;opacity:.88}
.sync-status.is-syncing::before{content:"↻ ";}

@media(max-width:720px){.sync-status{display:none}}
