<section id="speakingPart4Future" class="p4dev hidden" aria-label="Speaking Part 4">
  <div class="p4-unified-switch" role="group" aria-label="Speaking part">
    <button type="button" data-p4-switch="part1"><strong>Part 1</strong><small>Personal questions · 30s</small></button>
    <button type="button" data-p4-switch="part2"><strong>Part 2</strong><small>Photo + 2 questions · 45s</small></button>
    <button type="button" data-p4-switch="part3"><strong>Part 3</strong><small>2 photos · compare · 45s</small></button>
    <button type="button" data-p4-switch="part4" class="active" aria-current="page"><strong>Part 4</strong><small>3 questions · 2 min</small></button>
  </div>
  <section id="p4TopicLibrary" class="p4-topic-library" aria-label="Part 4 topic library"><div class="p4-library-title"><h3>Part 4 · Topic library</h3><p>Choose one topic to practise all three questions.</p></div><div id="p4TopicCards" class="p4-topic-grid"></div></section>
  <div id="p4TopicDetail" class="p4-topic-detail" hidden><div class="p4-topic-navigation"><button id="p4BackLibrary" type="button">← All topics</button><span id="p4TopicPosition" aria-live="polite"></span><button id="p4PrevTopic" type="button">← Prev</button><button id="p4NextTopic" type="button">Next →</button></div><div class="p4-topic-heading"><div class="p4-topic-meta"><span id="p4TopicBadge"></span></div><h3 id="p4TopicTitle"></h3></div>
  <div class="p4-study-tabs" role="group" aria-label="Part 4 learning steps">
    <button type="button" data-p4-step="learn" class="p4-step-btn active">01 Learn</button>
    <button type="button" data-p4-step="memorize" class="p4-step-btn">02 Memorize</button>
    <button type="button" data-p4-step="test" class="p4-step-btn">03 Test</button>
  </div>
  <div class="p4dev-controls"><label for="p4Mode">Study path</label><select id="p4Mode"><option value="learn">01–02 · Learn & Memorize</option><option value="exam">03 · Test (approved sets)</option></select><label for="p4Set">Topic</label><select id="p4Set"></select><button id="p4Load" type="button">Load</button></div>
  <div id="p4LearningTools" class="p4-learning-tools">
    <label for="p4StudyView">01 Learn / 02 Memorize</label>
    <select id="p4StudyView"><option value="full">01 Learn · Full teacher-first model</option><option value="formula">02 Memorize · Formula cues</option><option value="recall">02 Memorize · No help</option></select>
    <label for="p4VoiceRate">Listening speed</label><select id="p4VoiceRate"><option value="0.85" selected>0.85×</option><option value="0.75">0.75×</option><option value="1">1.00×</option></select>
    <button id="p4StopAudio" type="button">Stop audio</button>
    <label for="p4MasteryLevel">Memorized</label>
    <select id="p4MasteryLevel"><option value="0">0 · Not started</option><option value="1">1 · Reading</option><option value="2">2 · Recall with hints</option><option value="3">3 · Speak without looking</option></select>
    <button id="p4SaveMastery" type="button">Save mastery</button>
    <span id="p4MasterySaved" role="status" aria-live="polite"></span>
    <div id="p4MasteryOverview" class="p4-mastery-overview"></div>
  </div>
  <p id="p4Status" role="status" aria-live="polite"></p><div id="p4Models" class="p4dev-models"></div><div id="p4Content" class="p4dev-content"></div>
  <div class="p4dev-time"><span id="p4Stage">Ready</span><strong id="p4Time">01:00</strong><button id="p4Begin" type="button">Start preparation</button><button id="p4Next" type="button" disabled>Start speaking</button><button id="p4Stop" type="button" disabled>Stop</button></div>
  <div id="p4Review" class="p4dev-models" hidden><label for="p4Rating">Self-rating (0–5)</label><select id="p4Rating"><option value="0">0 · Not rated</option><option value="1">1 · Difficult</option><option value="2">2 · Needs practice</option><option value="3">3 · Fair</option><option value="4">4 · Good</option><option value="5">5 · Confident</option></select><label for="p4Note">Note</label><input id="p4Note" maxlength="300" placeholder="What should I improve?"><button id="p4Save" type="button">Save practice</button><button id="p4Read" type="button">Check saved progress</button><p id="p4Saved" aria-live="polite"></p></div>
  <p class="p4dev-disclaimer">Learn mode has listening, formula-only and recall practice. Exam mode hides all model answers. Microphone recording is not enabled.</p></div>
</section>
