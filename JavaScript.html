<!-- JavaScript.html -->
<script>
// Biến toàn cục
let allPhrases = [];
let currentPhrases = [];
let learnedPhrases = [];
let currentCategory = 'all';
let currentPage = 1;
const phrasesPerPage = 3;

// Biến lưu trữ giọng nói đã chọn
let selectedVoice = null;
let availableVoices = [];

// Thêm biến global để theo dõi trạng thái chuyển đổi tab
let isTabSwitching = false;
let currentPracticeMode = 'listen';

let currentLearningStatus = 'all'; // 'all', 'learned', 'unlearned'

// Các phần tử DOM
const phraseContainer = document.getElementById('phraseContainer');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const categoryBtns = document.querySelectorAll('.category-btn');
const randomPhraseBtn = document.getElementById('randomPhraseBtn');
const practiceBtn = document.getElementById('practiceBtn');
const helpBtn = document.getElementById('helpBtn');
const practiceModal = document.getElementById('practiceModal');
const helpModal = document.getElementById('helpModal');
const closeBtns = document.querySelectorAll('.close-modal');
const learnedCountEl = document.getElementById('learnedCount');
const totalPhrasesEl = document.getElementById('totalPhrases');
const practiceModeButtons = document.querySelectorAll('.practice-mode-btn');

// Khởi tạo ứng dụng
document.addEventListener('DOMContentLoaded', function() {
  // Tạo hiệu ứng nền động
  createAnimatedBackground();
  
  // Tạo hiệu ứng chữ cái cho tiêu đề
  createTitleEffect();
  
  // Tải dữ liệu cụm từ - bây giờ sẽ trộn ngẫu nhiên
  loadPhrases();
  
  // Thêm CSS và các tính năng khác
  addLearningStatusFilterCSS();
  addStatusFilterHoverEffect();
  addFilterChangeCSS();
  addRandomPhraseWidthCSS();
  
  // Tạo bộ lọc trạng thái học (thay thế ô tìm kiếm)
  createLearningStatusFilter();
  
  // Thiết lập sự kiện
  setupEventListeners();
  
  // Khôi phục trạng thái đã học từ localStorage (nếu có)
  restoreLearnedState();
  
  // Khởi tạo tính năng chọn giọng nói
  initVoiceSelection();
  
  // Thêm CSS tùy chỉnh cho icon
  addCustomCSS();
});

// Tạo hiệu ứng nền động với các hình tròn và sao
function createAnimatedBackground() {
  const background = document.querySelector('.animated-background');
  
  // Tạo các bong bóng
  for (let i = 0; i < 15; i++) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    
    // Kích thước ngẫu nhiên
    const size = Math.random() * 80 + 30;
    bubble.style.width = `${size}px`;
    bubble.style.height = `${size}px`;
    
    // Vị trí ngẫu nhiên
    bubble.style.left = `${Math.random() * 100}%`;
    bubble.style.top = `${Math.random() * 100}%`;
    
    // Độ trễ hoạt ảnh ngẫu nhiên
    bubble.style.animationDelay = `${Math.random() * 10}s`;
    // Thời gian hoạt ảnh ngẫu nhiên
    bubble.style.animationDuration = `${Math.random() * 10 + 15}s`;
    
    background.appendChild(bubble);
  }
  
  // Tạo các ngôi sao
  for (let i = 0; i < 25; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    
    // Kích thước ngẫu nhiên
    const size = Math.random() * 4 + 1;
    star.style.width = `${size}px`;
    star.style.height = `${size}px`;
    
    // Vị trí ngẫu nhiên
    star.style.left = `${Math.random() * 100}%`;
    star.style.top = `${Math.random() * 100}%`;
    
    // Độ trễ hoạt ảnh ngẫu nhiên
    star.style.animationDelay = `${Math.random() * 5}s`;
    star.style.animationDuration = `${Math.random() * 3 + 2}s`;
    
    background.appendChild(star);
  }
}

// Tạo hiệu ứng chữ cái cho tiêu đề
function createTitleEffect() {
  const title = document.querySelector('.app-title');
  if (!title) return;
  
  const text = title.textContent;
  let html = '';
  
  // Tạo HTML cho mỗi chữ cái
  for (let i = 0; i < text.length; i++) {
    if (text[i] === ' ') {
      html += ' ';
    } else {
      html += `<span class="title-letter">${text[i]}</span>`;
    }
  }
  
  title.innerHTML = html;
  
  // Tạo hiệu ứng chữ cái bay
  const letters = title.querySelectorAll('.title-letter');
  letters.forEach((letter, index) => {
    letter.style.animationDelay = `${index * 0.1}s`;
  });
}

// Thiết lập các sự kiện lắng nghe
function setupEventListeners() {
  // Sự kiện tìm kiếm
  searchBtn.addEventListener('click', searchPhrases);
  searchInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      searchPhrases();
    }
  });
  
  // Thiết lập sự kiện cho các nút danh mục - Tách riêng
  setupCategoryButtons();
  
  // Sự kiện ngẫu nhiên
  randomPhraseBtn.addEventListener('click', function() {
    showRandomPhrase();
  });
  
  // Mở modal luyện tập
  practiceBtn.addEventListener('click', function() {
    openPracticeModal();
  });
  
  // Mở modal hướng dẫn
  helpBtn.addEventListener('click', function() {
    helpModal.style.display = 'block';
  });
  
  // Đóng modal
  closeBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      practiceModal.style.display = 'none';
      helpModal.style.display = 'none';
      
      // Đóng modal giọng nói nếu có
      const voiceModal = document.getElementById('voiceModal');
      if (voiceModal) {
        voiceModal.style.display = 'none';
      }
    });
  });
  
  // Đóng modal khi click bên ngoài
  window.addEventListener('click', function(event) {
    if (event.target === practiceModal) {
      practiceModal.style.display = 'none';
    }
    if (event.target === helpModal) {
      helpModal.style.display = 'none';
    }
    
    // Đóng modal giọng nói nếu click bên ngoài
    const voiceModal = document.getElementById('voiceModal');
    if (voiceModal && event.target === voiceModal) {
      voiceModal.style.display = 'none';
    }
  });
  
  // Chuyển đổi chế độ luyện tập
  practiceModeButtons.forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault(); // Ngăn chặn hành vi mặc định
      
      // Lấy chế độ từ dataset
      const mode = btn.dataset.mode;
      
      // Nếu đang trong quá trình chuyển tab, bỏ qua click
      if (isTabSwitching) {
        console.log('Đang chuyển tab, bỏ qua click mới');
        return;
      }
      
      // Kiểm tra nếu nút này đã active thì chỉ làm mới nội dung
      if (btn.classList.contains('active')) {
        console.log('Tab đã active, làm mới nội dung');
        
        const practiceContent = document.querySelector('.practice-content');
        practiceContent.innerHTML = '<div class="loading-animation"><div class="spinner"></div><p>Đang tải...</p></div>';
        
        // Làm mới nội dung tab hiện tại
        setTimeout(() => {
          setupPracticeMode(mode);
        }, 150);
        
        return;
      }
      
      // Đánh dấu đang trong quá trình chuyển tab
      isTabSwitching = true;
      
      // Lưu lại chế độ hiện tại
      currentPracticeMode = mode;
      
      // Cập nhật trạng thái active
      practiceModeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      // Xóa nội dung hiện tại và hiển thị loading
      const practiceContent = document.querySelector('.practice-content');
      practiceContent.innerHTML = '<div class="loading-animation"><div class="spinner"></div><p>Đang chuyển chế độ...</p></div>';
      
      // Sử dụng thời gian timeout dài hơn để đảm bảo DOM được cập nhật
      setTimeout(() => {
        try {
          setupPracticeMode(mode);
        } catch (error) {
          console.error('Lỗi khi thiết lập chế độ luyện tập:', error);
          practiceContent.innerHTML = `
            <div class="error-message">
              <p>Có lỗi xảy ra khi tải chế độ luyện tập. Vui lòng thử lại.</p>
              <button onclick="retrySetupPracticeMode('${mode}')">Thử lại</button>
            </div>
          `;
        } finally {
          // Đánh dấu đã hoàn thành chuyển tab
          isTabSwitching = false;
        }
      }, 200); // Tăng thời gian delay lên 200ms
    });
  });

  // Sự kiện tìm kiếm realtime
  searchInput.addEventListener('input', function() {
    realTimeSearch();
  });
}

// 2. Thêm hàm retry để thử lại khi gặp lỗi
function retrySetupPracticeMode(mode) {
  const practiceContent = document.querySelector('.practice-content');
  practiceContent.innerHTML = '<div class="loading-animation"><div class="spinner"></div><p>Đang tải lại...</p></div>';
  
  setTimeout(() => {
    try {
      setupPracticeMode(mode);
    } catch (error) {
      console.error('Vẫn gặp lỗi khi tải lại chế độ luyện tập:', error);
      practiceContent.innerHTML = `
        <div class="error-message">
          <p>Không thể tải chế độ luyện tập. Vui lòng đóng và mở lại cửa sổ luyện tập.</p>
          <button onclick="practiceModal.style.display='none'">Đóng</button>
        </div>
      `;
    }
  }, 300);
}

// Thêm hàm mới để lấy danh sách cụm từ ngẫu nhiên theo danh mục
function getRandomPhrasesByCategory(category, limit = 0) {
  // Lọc cụm từ theo danh mục
  let filteredPhrases = category === 'all' ? 
    [...allPhrases] : 
    allPhrases.filter(phrase => phrase.category === category);
  
  // Trộn ngẫu nhiên mảng cụm từ
  filteredPhrases = shuffleArray([...filteredPhrases]);
  
  // Nếu có giới hạn số lượng và số lượng cụm từ lớn hơn giới hạn
  if (limit > 0 && filteredPhrases.length > limit) {
    filteredPhrases = filteredPhrases.slice(0, limit);
  }
  
  return filteredPhrases;
}

// Thêm hàm tìm kiếm realtime
function realTimeSearch() {
  const searchTerm = searchInput.value.trim().toLowerCase();
  
  if (searchTerm === '') {
    currentPhrases = [...allPhrases];
    currentPage = 1; // Reset về trang đầu tiên
    displayPhrases(currentPhrases);
    return;
  }
  
  const results = allPhrases.filter(phrase => 
    phrase.english.toLowerCase().includes(searchTerm) || 
    phrase.translation.toLowerCase().includes(searchTerm)
  );
  
  currentPhrases = results;
  currentPage = 1; // Reset về trang đầu tiên khi tìm kiếm mới
  displayPhrases(currentPhrases);
}

// Tải dữ liệu cụm từ từ Server
function loadPhrases() {
  // Hiển thị animation loading
  phraseContainer.innerHTML = `
    <div class="loading-animation">
      <div class="spinner"></div>
      <p>Đang tải dữ liệu...</p>
    </div>
  `;
  
  // Gọi hàm Server-side để lấy dữ liệu
  google.script.run
    .withSuccessHandler(function(data) {
      allPhrases = data;
      
      // THAY ĐỔI: Trộn ngẫu nhiên tất cả cụm từ ngay sau khi tải
      allPhrases = shuffleArray([...allPhrases]);
      
      // Cập nhật danh sách hiện tại (đã trộn ngẫu nhiên)
      currentPhrases = [...allPhrases];
      
      // Lọc theo danh mục hiện tại (nếu có)
      if (currentCategory !== 'all') {
        currentPhrases = currentPhrases.filter(phrase => phrase.category === currentCategory);
      }
      
      // Lọc theo trạng thái học (nếu có)
      if (currentLearningStatus === 'learned') {
        currentPhrases = currentPhrases.filter(phrase => learnedPhrases.includes(phrase.id));
      } else if (currentLearningStatus === 'unlearned') {
        currentPhrases = currentPhrases.filter(phrase => !learnedPhrases.includes(phrase.id));
      }
      
      // Hiển thị cụm từ đã trộn ngẫu nhiên
      currentPage = 1; // Reset về trang đầu tiên
      displayPhrases(currentPhrases);
      updateProgress();
      
      // Thêm icon cho các nút
      addIconsToButtons();
    })
    .withFailureHandler(function(error) {
      phraseContainer.innerHTML = `
        <div class="error-message">
          <p>Không thể tải dữ liệu: ${error}</p>
          <button onclick="loadPhrases()">Thử lại</button>
        </div>
      `;
    })
    .getPhrasesData();
}

// Hiển thị danh sách các cụm từ với phân trang
function displayPhrases(phrases) {
  phraseContainer.innerHTML = '';
  
  if (phrases.length === 0) {
    phraseContainer.innerHTML = `
      <div class="no-results">
        <p>Không tìm thấy cụm từ nào.</p>
      </div>
    `;
    return;
  }
  
  const template = document.getElementById('phraseCardTemplate');
  
  // Tính toán phân trang
  const totalPages = Math.ceil(phrases.length / phrasesPerPage);
  if (currentPage > totalPages) {
    currentPage = totalPages;
  }
  
  const startIndex = (currentPage - 1) * phrasesPerPage;
  const paginatedPhrases = phrases.slice(startIndex, startIndex + phrasesPerPage);
  
  // Hiển thị các cụm từ của trang hiện tại
  paginatedPhrases.forEach(phrase => {
    const clone = document.importNode(template.content, true);
    
    // Đặt dữ liệu vào template
    const card = clone.querySelector('.phrase-card');
    card.dataset.id = phrase.id;
    card.dataset.category = phrase.category;
    
    const img = clone.querySelector('.phrase-image img');
    img.src = phrase.imageUrl;
    img.alt = phrase.english;
    img.onerror = function() {
      // Nếu hình ảnh không tải được, hiển thị hình thay thế
      this.src = 'https://cdn.pixabay.com/photo/2016/11/03/18/19/music-1795431_960_720.jpg';
    };
    
    const categoryTag = clone.querySelector('.category-tag');
    categoryTag.textContent = getCategoryName(phrase.category);
    
    clone.querySelector('.phrase-english').textContent = phrase.english;
    clone.querySelector('.phrase-phonetic').textContent = phrase.phonetic;
    clone.querySelector('.phrase-translation').textContent = phrase.translation;
    
    // Kiểm tra nếu cụm từ đã được đánh dấu là đã học
    const markLearnedBtn = clone.querySelector('.mark-learned-btn');
    if (learnedPhrases.includes(phrase.id)) {
      card.classList.add('learned');
      markLearnedBtn.textContent = '✅ Đã Học';
      markLearnedBtn.classList.add('learned');
    }
    
    // Thêm sự kiện lắng nghe cho phát âm
    const pronunciationBtn = clone.querySelector('.pronunciation-btn');
    pronunciationBtn.addEventListener('click', function() {
      playPhrase(phrase.english, 1.0);
    });

    // Thêm sự kiện lắng nghe cho phát âm chậm
    const pronunciationSlowBtn = clone.querySelector('.pronunciation-slow-btn');
    pronunciationSlowBtn.addEventListener('click', function() {
      playPhrase(phrase.english, 0.6);
    });
    
    markLearnedBtn.addEventListener('click', function() {
      toggleLearnedStatus(phrase.id, card);
    });
    
    phraseContainer.appendChild(clone);
  });
  
  // Thêm phân trang
  if (totalPages > 1) {
    addPagination(phrases.length, totalPages);
  }
  
  // Cập nhật tổng số cụm từ
  totalPhrasesEl.textContent = allPhrases.length;
}

// Thêm UI phân trang
function addPagination(totalItems, totalPages) {
  const paginationContainer = document.createElement('div');
  paginationContainer.className = 'pagination-container';
  
  // Nút Previous
  const prevBtn = document.createElement('button');
  prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
  prevBtn.className = 'pagination-btn';
  prevBtn.disabled = currentPage === 1;
  prevBtn.addEventListener('click', function() {
    if (currentPage > 1) {
      currentPage--;
      displayPhrases(currentPhrases);
    }
  });
  
  // Số trang
  const pageDisplay = document.createElement('div');
  pageDisplay.className = 'page-display';
  pageDisplay.innerHTML = `
    <span class="current-page">${currentPage}</span>
    <span class="separator">/</span>
    <span class="total-pages">${totalPages}</span>
  `;
  
  // Nút Next
  const nextBtn = document.createElement('button');
  nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
  nextBtn.className = 'pagination-btn';
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.addEventListener('click', function() {
    if (currentPage < totalPages) {
      currentPage++;
      displayPhrases(currentPhrases);
    }
  });
  
  paginationContainer.appendChild(prevBtn);
  paginationContainer.appendChild(pageDisplay);
  paginationContainer.appendChild(nextBtn);
  
  phraseContainer.appendChild(paginationContainer);
}

// Hiển thị cụm từ ngẫu nhiên
function showRandomPhrase() {
  // Lấy danh sách cụm từ theo danh mục hiện tại
  let filteredPhrases = currentCategory === 'all' ? 
    [...allPhrases] : 
    allPhrases.filter(phrase => phrase.category === currentCategory);
  
  // Lọc thêm theo trạng thái học
  if (currentLearningStatus === 'learned') {
    filteredPhrases = filteredPhrases.filter(phrase => learnedPhrases.includes(phrase.id));
  } else if (currentLearningStatus === 'unlearned') {
    filteredPhrases = filteredPhrases.filter(phrase => !learnedPhrases.includes(phrase.id));
  }
  
  if (filteredPhrases.length === 0) {
    alert('Không có cụm từ nào phù hợp với bộ lọc hiện tại!');
    return;
  }
  
  // Chọn ngẫu nhiên một cụm từ
  const randomIndex = Math.floor(Math.random() * filteredPhrases.length);
  const randomPhrase = filteredPhrases[randomIndex];
  
  // Xóa nội dung hiện tại
  phraseContainer.innerHTML = '';
  
  // Sử dụng template
  const template = document.getElementById('phraseCardTemplate');
  const clone = document.importNode(template.content, true);
  
  // Đặt dữ liệu vào template
  const card = clone.querySelector('.phrase-card');
  card.classList.add('random-card', 'random-appear');
  card.dataset.id = randomPhrase.id;
  card.dataset.category = randomPhrase.category;
  
  const img = clone.querySelector('.phrase-image img');
  img.src = randomPhrase.imageUrl;
  img.alt = randomPhrase.english;
  img.onerror = function() {
    this.src = 'https://cdn.pixabay.com/photo/2016/11/03/18/19/music-1795431_960_720.jpg';
  };
  
  const categoryTag = clone.querySelector('.category-tag');
  categoryTag.textContent = getCategoryName(randomPhrase.category);
  
  clone.querySelector('.phrase-english').textContent = randomPhrase.english;
  clone.querySelector('.phrase-phonetic').textContent = randomPhrase.phonetic;
  clone.querySelector('.phrase-translation').textContent = randomPhrase.translation;
  
  // Kiểm tra nếu cụm từ đã được đánh dấu là đã học
  const markLearnedBtn = clone.querySelector('.mark-learned-btn');
  if (learnedPhrases.includes(randomPhrase.id)) {
    card.classList.add('learned');
    markLearnedBtn.textContent = '✅ Đã Học';
    markLearnedBtn.classList.add('learned');
  }
  
  // Thêm sự kiện lắng nghe cho phát âm
  const pronunciationBtn = clone.querySelector('.pronunciation-btn');
  pronunciationBtn.addEventListener('click', function() {
    playPhrase(randomPhrase.english, 1.0);
  });

  // Thêm sự kiện lắng nghe cho phát âm chậm
  const pronunciationSlowBtn = clone.querySelector('.pronunciation-slow-btn');
  pronunciationSlowBtn.addEventListener('click', function() {
    playPhrase(randomPhrase.english, 0.6);
  });
  
  markLearnedBtn.addEventListener('click', function() {
    toggleLearnedStatus(randomPhrase.id, card);
  });
  
  // Tạo container ngẫu nhiên và thêm card vào
  const randomContainer = document.createElement('div');
  randomContainer.className = 'random-phrase-container';
  randomContainer.appendChild(clone);
  
  phraseContainer.appendChild(randomContainer);
  
  // Animation phóng to thu nhỏ
  setTimeout(() => {
    card.classList.remove('random-appear');
  }, 1000);
  
  // Tự động phát âm sau khi hiển thị (đợi animation hoàn tất)
  setTimeout(() => {
    // Phát âm cụm từ ngẫu nhiên với giọng đã chọn (nếu có)
    if ('speechSynthesis' in window) {
      // Dừng phát âm hiện tại nếu có
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(randomPhrase.english);
      
      // Sử dụng giọng đã chọn nếu có
      if (selectedVoice) {
        // Tìm giọng trong danh sách giọng hiện tại
        const voices = window.speechSynthesis.getVoices();
        const matchingVoice = voices.find(v => v.voiceURI === selectedVoice.voiceURI);
        
        if (matchingVoice) {
          utterance.voice = matchingVoice;
        }
      }
      
      utterance.lang = 'en-US';
      utterance.rate = 1.0;
      
      // Phát âm thanh
      window.speechSynthesis.speak(utterance);
    } else {
      // Dùng phương pháp dự phòng nếu Web Speech API không khả dụng
      playPhraseUsingGoogleTTS(randomPhrase.english);
    }
  }, 800); // Đợi animation khởi động trước khi phát âm
}

// Thêm hiệu ứng hover cho bộ lọc trạng thái học để trải nghiệm tốt hơn
function addStatusFilterHoverEffect() {
  const styleElement = document.createElement('style');
  styleElement.textContent = `
    .status-filter-btn:hover {
      transform: translateY(-2px);
      background-color: #f0e8ff;
      box-shadow: 0 4px 8px rgba(106, 85, 184, 0.2);
    }
    
    .status-filter-btn.active:hover {
      background-color: #5d49a0;
    }
    
    .status-filter-btn i {
      transform: scale(1.2);
    }
    
    /* Hiệu ứng chuyển đổi trạng thái active mượt mà */
    .status-filter-btn {
      position: relative;
      overflow: hidden;
    }
    
    .status-filter-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.5);

// Hàm phát âm cụm từ đã sửa
function playPhrase(text, rate = 1.0) {
  try {
    // Xác định nút được nhấn
    const btn = event.currentTarget;
    const icon = btn.querySelector('i');
    
    // Bật icon loading
    if (icon) {
      icon.className = rate === 1.0 ? 'fas fa-spinner fa-spin' : 'fas fa-spinner fa-spin';
    }
    
    // Kiểm tra Web Speech API có hỗ trợ không
    if ('speechSynthesis' in window) {
      // Hủy phát âm đang diễn ra
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      
      // Sử dụng giọng đã chọn nếu có
      if (selectedVoice) {
        // Tìm giọng trong danh sách giọng hiện tại
        const voices = window.speechSynthesis.getVoices();
        const matchingVoice = voices.find(v => v.voiceURI === selectedVoice.voiceURI);
        
        if (matchingVoice) {
          utterance.voice = matchingVoice;
        }
      }
      
      utterance.lang = 'en-US';
      utterance.rate = rate; // Tốc độ được truyền vào
      
      // Xử lý khi âm thanh đã phát
      utterance.onend = function() {
        if (icon) {
          icon.className = rate === 1.0 ? 'fas fa-volume-up' : 'fas fa-walking';
        }
      };
      
      // Xử lý khi có lỗi
      utterance.onerror = function() {
        if (icon) {
          icon.className = rate === 1.0 ? 'fas fa-volume-up' : 'fas fa-walking';
        }
        // Thử phương pháp thứ hai nếu Web Speech API thất bại
        playPhraseUsingGoogleTTS(text, rate);
      };
      
      // Phát âm thanh
      window.speechSynthesis.speak(utterance);
    } else {
      // Thử dùng phương pháp Google TTS
      playPhraseUsingGoogleTTS(text, rate);
    }
  } catch (e) {
    console.error('Lỗi khi phát âm thanh:', e);
    const icon = event?.currentTarget?.querySelector('i');
    if (icon) {
      icon.className = rate === 1.0 ? 'fas fa-volume-up' : 'fas fa-walking';
    }
    // Thử phương pháp thứ hai
    playPhraseUsingGoogleTTS(text, rate);
  }
}

// Phương pháp dự phòng sử dụng Google TTS thông qua server
function playPhraseUsingGoogleTTS(text, rate = 1.0) {
  google.script.run
    .withSuccessHandler(function(audioUrl) {
      try {
        const audio = new Audio();
        const btn = event?.currentTarget;
        const icon = btn?.querySelector('i');
        
        // Xử lý khi audio đã sẵn sàng
        audio.oncanplaythrough = function() {
          if (icon) {
            icon.className = rate === 1.0 ? 'fas fa-volume-up' : 'fas fa-walking';
          }
          // Đặt tốc độ phát
          audio.playbackRate = rate;
          audio.play();
        };
        
        // Xử lý lỗi
        audio.onerror = function() {
          console.error('Không thể phát âm thanh từ Google TTS');
          if (icon) {
            icon.className = rate === 1.0 ? 'fas fa-volume-up' : 'fas fa-walking';
          }
        };
        
        audio.src = audioUrl;
        audio.load();
      } catch (e) {
        console.error('Lỗi khi tạo audio:', e);
        const icon = event?.currentTarget?.querySelector('i');
        if (icon) {
          icon.className = rate === 1.0 ? 'fas fa-volume-up' : 'fas fa-walking';
        }
      }
    })
    .withFailureHandler(function(error) {
      console.error('Lỗi khi lấy URL âm thanh:', error);
      const icon = event?.currentTarget?.querySelector('i');
      if (icon) {
        icon.className = rate === 1.0 ? 'fas fa-volume-up' : 'fas fa-walking';
      }
    })
    .getAudioUrl(text);
}

// Đánh dấu cụm từ đã học/chưa học
function toggleLearnedStatus(phraseId, card) {
  const btn = card.querySelector('.mark-learned-btn');
  const index = learnedPhrases.indexOf(phraseId);
  
  if (index === -1) {
    // Đánh dấu là đã học
    learnedPhrases.push(phraseId);
    card.classList.add('learned');
    btn.textContent = '✅ Đã Học';
    btn.classList.add('learned');
    
    // Hiệu ứng hoàn thành
    createCompletionEffect(card);
  } else {
    // Bỏ đánh dấu
    learnedPhrases.splice(index, 1);
    card.classList.remove('learned');
    btn.textContent = 'Đánh Dấu Đã Học';
    btn.classList.remove('learned');
  }
  
  // Lưu trạng thái
  saveLearnedState();
  
  // Cập nhật thanh tiến trình
  updateProgress();
  
  // THÊM MỚI: Áp dụng lại bộ lọc nếu đang ở chế độ lọc theo trạng thái học
  if (currentLearningStatus !== 'all') {
    // Đợi một chút để hoàn thành animation
    setTimeout(() => {
      applyFilters();
    }, 600);
  }
}

// Tạo hiệu ứng hoàn thành
function createCompletionEffect(card) {
  const particles = document.createElement('div');
  particles.className = 'completion-particles';
  
  // Tạo các hạt
  for (let i = 0; i < 15; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    
    // Màu ngẫu nhiên
    const hue = Math.random() * 60 + 180; // Xanh dương - xanh lá
    particle.style.backgroundColor = `hsl(${hue}, 100%, 60%)`;
    
    // Kích thước ngẫu nhiên
    const size = Math.random() * 6 + 2;
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;
    
    // Vị trí ngẫu nhiên
    particle.style.left = `${Math.random() * 100}%`;
    particle.style.top = `${Math.random() * 100}%`;
    
    particles.appendChild(particle);
  }
  
  card.appendChild(particles);
  
  // Xóa hiệu ứng sau khi hoàn thành
  setTimeout(() => {
    particles.remove();
  }, 1500);
}

// Cập nhật thanh tiến trình
function updateProgress() {
  const totalPhrases = allPhrases.length;
  const learnedCount = learnedPhrases.length;
  
  const progressPercent = totalPhrases > 0 ? (learnedCount / totalPhrases) * 100 : 0;
  document.querySelector('.progress-fill').style.width = `${progressPercent}%`;
  
  learnedCountEl.textContent = learnedCount;
}

// Tìm kiếm cụm từ
function searchPhrases() {

  if (searchTerm === '') {
    currentPhrases = [...allPhrases];
    currentPage = 1;
    displayPhrases(currentPhrases);
    return;
  }
  
  const results = allPhrases.filter(phrase => 
    phrase.english.toLowerCase().includes(searchTerm) || 
    phrase.translation.toLowerCase().includes(searchTerm)

  currentPhrases = results;
  currentPage = 1;
  displayPhrases(results);
}

  console.log(`Đang thiết lập chế độ: ${mode}`);
  
  const practiceContent = document.querySelector('.practice-content');
  const learnedPhrasesData = allPhrases.filter(phrase => learnedPhrases.includes(phrase.id));

        console.error('Lỗi khi thiết lập chế độ Nghe & Chọn:', error);

          <div class="error-message">
            <p>Có lỗi khi tải chế độ Nghe & Chọn. Vui lòng thử lại.</p>
            <button onclick="retrySetupPracticeMode('listen')">Thử lại</button>
          </div>
        `;

      break;

        setupMatchPairs(practiceContent, learnedPhrasesData);
      } catch (error) {
        console.error('Lỗi khi thiết lập chế độ Ghép Cặp:', error);
        practiceContent.innerHTML = `
          <div class="error-message">
            <p>Có lỗi khi tải chế độ Ghép Cặp. Vui lòng thử lại.</p>
            <button onclick="retrySetupPracticeMode('match')">Thử lại</button>
          </div>
        `;
      }
      break;
    case 'fill':
      try {
        setupFillBlanks(practiceContent, learnedPhrasesData);
      } catch (error) {
        console.error('Lỗi khi thiết lập chế độ Điền Vào Chỗ Trống:', error);
        practiceContent.innerHTML = `
          <div class="error-message">
            <p>Có lỗi khi tải chế độ Điền Vào Chỗ Trống. Vui lòng thử lại.</p>
            <button onclick="retrySetupPracticeMode('fill')">Thử lại</button>

      practiceContent.innerHTML = `
        <div class="error-message">
          <p>Chế độ luyện tập không hợp lệ.</p>
        </div>

}

  console.log('Đã thêm HTML cho Nghe & Chọn');
  
  // Sử dụng requestAnimationFrame để đảm bảo DOM đã được cập nhật

    }

    document.getElementById('playPhraseBtn').addEventListener('click', function() {

      const icon = this.querySelector('i');
      if (icon) icon.className = 'fas fa-spinner fa-spin'; // Thêm dòng này
      playPracticePhrase(text, 1.0, 'fa-volume-up'); // Thêm tham số icon
    });
    
    document.getElementById('replayPhraseBtn').addEventListener('click', function() {
      const text = this.getAttribute('data-text');
      const icon = this.querySelector('i');
      if (icon) icon.className = 'fas fa-spinner fa-spin'; // Thêm dòng này
      playPracticePhrase(text, 0.6, 'fa-redo'); // Thêm tham số icon
    });
    
    // Thêm sự kiện click cho các lựa chọn
    const options = container.querySelectorAll('.option-item');
    if (options.length === 0) {
      console.error('Không tìm thấy các lựa chọn trong DOM');
      return;
    }
    
    options.forEach(option => {
      option.addEventListener('click', function() {
        // Đã chọn rồi thì không cho chọn nữa
        if (container.querySelector('.option-item.selected')) return;
        
        // Đánh dấu đã chọn
        options.forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
        
        // Kiểm tra đáp án
        const isCorrect = option.dataset.correct === 'true';
        const resultFeedback = container.querySelector('.result-feedback');
        const nextButton = container.querySelector('.next-exercise-btn');
        
        if (isCorrect) {
          resultFeedback.innerHTML = '<div class="correct-answer">Đúng rồi! <i class="fas fa-check-circle"></i></div>';
          option.classList.add('correct');
        } else {
          resultFeedback.innerHTML = '<div class="wrong-answer">Sai rồi! Hãy thử lại. <i class="fas fa-times-circle"></i></div>';
          option.classList.add('wrong');
          
          // Hiển thị đáp án đúng
          options.forEach(opt => {
            if (opt.dataset.correct === 'true') {
              opt.classList.add('correct');
            }
          });
        }
        
        // Hiển thị nút tiếp theo
        nextButton.style.display = 'block';
      });
    });
    
    // Sự kiện cho nút câu tiếp theo
    const nextButton = container.querySelector('.next-exercise-btn');
    if (nextButton) {
      nextButton.addEventListener('click', function() {
        setupListenAndChoose(container, phrases);
      });
    }
    
    console.log('Đã thiết lập sự kiện cho các nút trong Nghe & Chọn');
    
    // Tự động phát âm sau khi hiển thị
    setTimeout(() => {
      playPracticePhrase(correctPhrase.english, 1.0);
    }, 300);
  });
}

// Hàm phát âm cho luyện tập đã sửa
function playPracticePhrase(text, rate = 1) {
  if (!text) {
    console.error('Thiếu text để phát âm');
    return;
  }
  
  try {
    // Kiểm tra xem có đang ở trong DOM không
    const btnPlayPhrase = document.getElementById('playPhraseBtn');
    const btnReplayPhrase = document.getElementById('replayPhraseBtn');
    
    // Xác định nút được nhấn để thay đổi icon
    let iconElement;
    if (rate === 1.0 && btnPlayPhrase) {
      iconElement = btnPlayPhrase.querySelector('i');
    } else if (rate === 0.6 && btnReplayPhrase) {
      iconElement = btnReplayPhrase.querySelector('i');
    }
    
    // Bật icon loading
    if (iconElement) {
      iconElement.className = 'fas fa-spinner fa-spin';
    }
    
    // Kiểm tra Web Speech API có hỗ trợ không
    if ('speechSynthesis' in window) {
      // Hủy phát âm đang diễn ra
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      
      // Sử dụng giọng đã chọn nếu có
      if (selectedVoice) {
        // Tìm giọng trong danh sách giọng hiện tại
        const voices = window.speechSynthesis.getVoices();
        const matchingVoice = voices.find(v => v.voiceURI === selectedVoice.voiceURI);
        
        if (matchingVoice) {
          utterance.voice = matchingVoice;
        }
      }
      
      utterance.lang = 'en-US';
      utterance.rate = rate;
      
      // Xử lý khi âm thanh đã phát
      utterance.onend = function() {
        if (iconElement) {
          iconElement.className = rate === 1.0 ? 'fas fa-volume-up' : 'fas fa-redo';
        }
      };
      
      // Xử lý khi có lỗi
      utterance.onerror = function() {
        if (iconElement) {
          iconElement.className = rate === 1.0 ? 'fas fa-volume-up' : 'fas fa-redo';
        }
        // Thử phương pháp thứ hai
        playPracticePhraseUsingGoogleTTS(text, rate);
      };
      
      // Phát âm thanh
      window.speechSynthesis.speak(utterance);
    } else {
      // Thử phương pháp thứ hai
      playPracticePhraseUsingGoogleTTS(text, rate);
    }
  } catch (e) {
    console.error('Lỗi khi phát âm luyện tập:', e);
    
    // Reset icon nếu lỗi
    try {
      const btnPlayPhrase = document.getElementById('playPhraseBtn');
      const btnReplayPhrase = document.getElementById('replayPhraseBtn');
      
      if (rate === 1.0 && btnPlayPhrase) {
        btnPlayPhrase.querySelector('i').className = 'fas fa-volume-up';
      } else if (rate === 0.6 && btnReplayPhrase) {
        btnReplayPhrase.querySelector('i').className = 'fas fa-redo';
      }
    } catch (iconError) {
      console.error('Không thể reset icon:', iconError);
    }
    
    // Thử phương pháp thứ hai
    playPracticePhraseUsingGoogleTTS(text, rate);
  }
}

// Phương pháp dự phòng cho luyện tập
function playPracticePhraseUsingGoogleTTS(text, rate = 1) {
  google.script.run
    .withSuccessHandler(function(audioUrl) {
      try {
        const audio = new Audio();
        
        // Xác định nút để thay đổi icon
        const btnPlayPhrase = document.getElementById('playPhraseBtn');
        const btnReplayPhrase = document.getElementById('replayPhraseBtn');
        
        // Khi audio đã sẵn sàng
        audio.oncanplaythrough = function() {
          // Reset icon
          if (rate === 1.0 && btnPlayPhrase) {
            btnPlayPhrase.querySelector('i').className = 'fas fa-volume-up';
          } else if (rate === 0.6 && btnReplayPhrase) {
            btnReplayPhrase.querySelector('i').className = 'fas fa-redo';
          }
          
          // Đặt tốc độ phát
          audio.playbackRate = rate;
          audio.play();
        };
        
        // Xử lý lỗi
        audio.onerror = function() {
          console.error('Không thể phát âm thanh luyện tập');
          // Reset icon
          if (rate === 1.0 && btnPlayPhrase) {
            btnPlayPhrase.querySelector('i').className = 'fas fa-volume-up';
          } else if (rate === 0.6 && btnReplayPhrase) {
            btnReplayPhrase.querySelector('i').className = 'fas fa-redo';
          }
        };
        
        audio.src = audioUrl;
        audio.load();
      } catch (e) {
        console.error('Lỗi khi tạo audio luyện tập:', e);
        
        // Reset icon
        try {
          const btnPlayPhrase = document.getElementById('playPhraseBtn');
          const btnReplayPhrase = document.getElementById('replayPhraseBtn');
          
          if (rate === 1.0 && btnPlayPhrase) {
            btnPlayPhrase.querySelector('i').className = 'fas fa-volume-up';
          } else if (rate === 0.6 && btnReplayPhrase) {
            btnReplayPhrase.querySelector('i').className = 'fas fa-redo';
          }
        } catch (iconError) {
          console.error('Không thể reset icon:', iconError);
        }
      }
    })
    .withFailureHandler(function(error) {
      console.error('Lỗi khi lấy URL âm thanh luyện tập:', error);
      
      // Reset icon
      try {
        const btnPlayPhrase = document.getElementById('playPhraseBtn');
        const btnReplayPhrase = document.getElementById('replayPhraseBtn');
        
        if (rate === 1.0 && btnPlayPhrase) {
          btnPlayPhrase.querySelector('i').className = 'fas fa-volume-up';
        } else if (rate === 0.6 && btnReplayPhrase) {
          btnReplayPhrase.querySelector('i').className = 'fas fa-redo';
        }
      } catch (iconError) {
        console.error('Không thể reset icon:', iconError);
      }
    })
    .getAudioUrl(text);
}

// Thiết lập luyện tập: Ghép cặp
function setupMatchPairs(container, phrases) {
  // Lấy ngẫu nhiên 5 cụm từ
  const randomPhrases = getRandomItems(phrases, 5);
  
  // Tạo danh sách tiếng Anh và tiếng Việt
  const englishItems = randomPhrases.map((phrase, index) => ({
    id: index,
    text: phrase.english,
    type: 'english'
  }));
  
  const vietnameseItems = randomPhrases.map((phrase, index) => ({
    id: index,
    text: phrase.translation,
    type: 'vietnamese'
  }));
  
  // Trộn ngẫu nhiên cả hai danh sách
  const shuffledEnglish = shuffleArray([...englishItems]);
  const shuffledVietnamese = shuffleArray([...vietnameseItems]);
  
  let html = `
    <div class="match-exercise">
      <h3>Hãy ghép cặp cụm từ tiếng Anh và tiếng Việt:</h3>
      <div class="match-container">
        <div class="match-column english-column">
  `;
  
  shuffledEnglish.forEach(item => {
    html += `
      <div class="match-item" data-id="${item.id}" data-type="${item.type}">
        <span class="match-text">${item.text}</span>
      </div>
    `;
  });
  
  html += `
        </div>
        <div class="match-column vietnamese-column">
  `;
  
  shuffledVietnamese.forEach(item => {
    html += `
      <div class="match-item" data-id="${item.id}" data-type="${item.type}">
        <span class="match-text">${item.text}</span>
      </div>
    `;
  });
  
  html += `
        </div>
      </div>
      <div class="match-feedback"></div>
      <button class="next-exercise-btn" style="display: none;">Bài tiếp theo</button>
    </div>
  `;
  
  container.innerHTML = html;
  
  // Thiết lập sự kiện ghép cặp
  setupMatchEvents(container);
}

// Thiết lập sự kiện cho luyện tập ghép cặp
function setupMatchEvents(container) {
  const matchItems = container.querySelectorAll('.match-item');
  let selectedItem = null;
  let matchedCount = 0;
  const totalPairs = container.querySelectorAll('.english-column .match-item').length;
  
  matchItems.forEach(item => {
    item.addEventListener('click', function() {
      // Nếu item đã ghép rồi thì không làm gì
      if (item.classList.contains('matched')) return;
      
      if (selectedItem === null) {
        // Chọn item đầu tiên
        selectedItem = item;
        item.classList.add('selected');
      } else {
        // Kiểm tra ghép cặp
        const firstId = selectedItem.dataset.id;
        const secondId = item.dataset.id;
        const firstType = selectedItem.dataset.type;
        const secondType = item.dataset.type;
        
        // Nếu đã chọn cùng loại (cả hai là tiếng Anh hoặc cả hai là tiếng Việt)
        if (firstType === secondType) {
          selectedItem.classList.remove('selected');
          selectedItem = item;
          item.classList.add('selected');
          return;
        }
        
        // Kiểm tra xem có ghép đúng không
        if (firstId === secondId) {
          // Ghép đúng
          selectedItem.classList.remove('selected');
          selectedItem.classList.add('matched');
          item.classList.add('matched');
          
          // Animation cho ghép đúng
          createMatchEffect(selectedItem);
          createMatchEffect(item);
          
          matchedCount++;
          
          // Kiểm tra nếu đã hoàn thành tất cả
          if (matchedCount === totalPairs) {
            container.querySelector('.match-feedback').innerHTML = 
              '<div class="correct-answer">Tuyệt vời! Bạn đã hoàn thành bài tập. <i class="fas fa-trophy"></i></div>';
            container.querySelector('.next-exercise-btn').style.display = 'block';
          }
          
          selectedItem = null;
        } else {
          // Ghép sai - hiệu ứng rung lắc
          selectedItem.classList.add('shake');
          item.classList.add('shake');
          
          setTimeout(() => {
            selectedItem.classList.remove('selected', 'shake');
            item.classList.remove('shake');
            selectedItem = null;
          }, 500);
        }
      }
    });
  });
  
  // Sự kiện cho nút tiếp theo
  container.querySelector('.next-exercise-btn').addEventListener('click', function() {
    const learnedPhrasesData = allPhrases.filter(phrase => learnedPhrases.includes(phrase.id));
    setupMatchPairs(container, learnedPhrasesData);
  });
}

// Tạo hiệu ứng khi ghép cặp đúng
function createMatchEffect(element) {
  const rect = element.getBoundingClientRect();
  const effect = document.createElement('div');
  effect.className = 'match-effect';
  
  // Đặt vị trí và kích thước giống với phần tử gốc
  effect.style.width = rect.width + 'px';
  effect.style.height = rect.height + 'px';
  effect.style.left = '0';
  effect.style.top = '0';
  
  element.style.position = 'relative';
  element.appendChild(effect);
  
  // Xóa hiệu ứng sau khi hoàn thành
  setTimeout(() => {
    effect.remove();
  }, 1000);
}

// Thiết lập luyện tập: Điền vào chỗ trống
function setupFillBlanks(container, phrases) {
  // Lấy ngẫu nhiên một cụm từ
  const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
  const words = randomPhrase.english.split(' ');
  
  // Chọn ngẫu nhiên 1-2 từ để tạo chỗ trống
  const totalWords = words.length;
  const blanksCount = totalWords <= 3 ? 1 : 2;
  
  // Tạo mảng vị trí các từ sẽ bị ẩn
  let blankPositions = [];
  while (blankPositions.length < blanksCount) {
    const pos = Math.floor(Math.random() * totalWords);
    if (!blankPositions.includes(pos)) {
      blankPositions.push(pos);
    }
  }
  
  // Tạo một mảng các từ gợi ý (bao gồm các từ bị ẩn và một số từ nhiễu)
  let wordBank = [...blankPositions.map(pos => words[pos])];
  
  // Thêm 2-3 từ nhiễu
  const extraWords = ['the', 'a', 'is', 'are', 'to', 'from', 'with', 'for', 'in', 'on', 'at'];
  while (wordBank.length < blanksCount + 3) {
    const extraWord = extraWords[Math.floor(Math.random() * extraWords.length)];
    if (!wordBank.includes(extraWord)) {
      wordBank.push(extraWord);
    }
  }
  
  // Trộn ngẫu nhiên wordBank
  wordBank = shuffleArray(wordBank);
  
  // Tạo HTML
  let sentenceHtml = '';
  words.forEach((word, index) => {
    if (blankPositions.includes(index)) {
      sentenceHtml += `<span class="blank-space" data-correct="${word}"><input type="text" class="blank-input" /></span> `;
    } else {
      sentenceHtml += `<span class="word">${word}</span> `;
    }
  });
  
  let html = `
    <div class="fill-blanks-exercise">
      <h3>Hãy điền từ vào chỗ trống:</h3>
      <div class="fill-sentence">
        ${sentenceHtml}
      </div>
      <div class="word-bank">
  `;
  
  wordBank.forEach(word => {
    html += `<div class="word-option" draggable="true">${word}</div>`;
  });
  
  html += `
      </div>
      <div class="exercise-actions">
        <button class="check-answers-btn">Kiểm Tra</button>
        <button class="see-answer-btn">Xem Đáp Án</button>
        <button class="next-exercise-btn" style="display: none;">Câu tiếp theo</button>
      </div>
      <div class="fill-feedback"></div>
    </div>
  `;
  
  container.innerHTML = html;
  
  // Thiết lập kéo thả
  setupDragAndDrop(container);
  
  // Sự kiện kiểm tra đáp án
  container.querySelector('.check-answers-btn').addEventListener('click', function() {
    checkFillAnswers(container);
  });
  
  // Sự kiện xem đáp án
  container.querySelector('.see-answer-btn').addEventListener('click', function() {
    showFillAnswers(container);
  });
  
  // Sự kiện cho nút tiếp theo
  container.querySelector('.next-exercise-btn').addEventListener('click', function() {
    const learnedPhrasesData = allPhrases.filter(phrase => learnedPhrases.includes(phrase.id));
    setupFillBlanks(container, learnedPhrasesData);
  });
}

// Thiết lập sự kiện kéo thả cho bài tập điền vào chỗ trống
function setupDragAndDrop(container) {
  const wordOptions = container.querySelectorAll('.word-option');
  const blankSpaces = container.querySelectorAll('.blank-space');
  const inputs = container.querySelectorAll('.blank-input');
  
  // Cho phép nhập trực tiếp vào ô trống
  inputs.forEach(input => {
    input.addEventListener('input', function() {
      // Cập nhật giá trị nhập
      input.dataset.value = input.value;
    });
  });
  
  // Thiết lập sự kiện kéo thả
  wordOptions.forEach(option => {
    option.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', option.textContent);
      option.classList.add('dragging');
    });
    
    option.addEventListener('dragend', function() {
      option.classList.remove('dragging');
    });
    
    // Thêm sự kiện click để chọn từ
    option.addEventListener('click', function() {
      const activeInput = container.querySelector('.blank-input:focus');
      if (activeInput) {
        activeInput.value = option.textContent;
        activeInput.dataset.value = option.textContent;
      }
    });
  });
  
  blankSpaces.forEach(blank => {
    blank.addEventListener('dragover', function(e) {
      e.preventDefault();
      blank.classList.add('drag-over');
    });
    
    blank.addEventListener('dragleave', function() {
      blank.classList.remove('drag-over');
    });
    
    blank.addEventListener('drop', function(e) {
      e.preventDefault();
      blank.classList.remove('drag-over');
      
      const data = e.dataTransfer.getData('text/plain');
      const input = blank.querySelector('.blank-input');
      input.value = data;
      input.dataset.value = data;
    });
  });
}

// Kiểm tra đáp án cho bài tập điền vào chỗ trống
function checkFillAnswers(container) {
  const blankSpaces = container.querySelectorAll('.blank-space');
  let allCorrect = true;
  
  blankSpaces.forEach(blank => {
    const input = blank.querySelector('.blank-input');
    const userAnswer = input.value.trim().toLowerCase();
    const correctAnswer = blank.dataset.correct.toLowerCase();
    
    if (userAnswer === correctAnswer) {
      blank.classList.add('correct');
      blank.classList.remove('incorrect');
    } else {
      blank.classList.add('incorrect');
      blank.classList.remove('correct');
      allCorrect = false;
    }
  });
  
  const feedback = container.querySelector('.fill-feedback');
  if (allCorrect) {
    feedback.innerHTML = '<div class="correct-answer">Tuyệt vời! Bạn đã hoàn thành chính xác. <i class="fas fa-check-circle"></i></div>';
    container.querySelector('.next-exercise-btn').style.display = 'block';
  } else {
    feedback.innerHTML = '<div class="wrong-answer">Hãy kiểm tra lại các từ bạn đã điền. <i class="fas fa-times-circle"></i></div>';
  }
}

// Hiển thị đáp án cho bài tập điền vào chỗ trống
function showFillAnswers(container) {
  const blankSpaces = container.querySelectorAll('.blank-space');
  
  blankSpaces.forEach(blank => {
    const input = blank.querySelector('.blank-input');
    input.value = blank.dataset.correct;
    input.disabled = true;
    
    blank.classList.add('answered');
  });
  
  container.querySelector('.fill-feedback').innerHTML = 
    '<div class="neutral-answer">Đã hiển thị đáp án chính xác. <i class="fas fa-info-circle"></i></div>';
  container.querySelector('.next-exercise-btn').style.display = 'block';
}

// Hàm tiện ích: Lấy các mục ngẫu nhiên từ mảng
function getRandomItems(array, count) {
  const shuffled = shuffleArray([...array]);
  return shuffled.slice(0, Math.min(count, shuffled.length));
}

// Hàm tiện ích: Trộn ngẫu nhiên mảng
function shuffleArray(array) {
  // Sử dụng thuật toán Fisher-Yates (Knuth) để trộn một cách hiệu quả
  let currentIndex = array.length;
  let temporaryValue, randomIndex;

  // Trong khi còn phần tử để trộn...
  while (currentIndex !== 0) {
    // Chọn một phần tử còn lại...
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex -= 1;

    // Và hoán đổi nó với phần tử hiện tại
    temporaryValue = array[currentIndex];
    array[currentIndex] = array[randomIndex];
    array[randomIndex] = temporaryValue;
  }

  return array;
}

  if (!'speechSynthesis' in window) {
    femaleVoicesList.innerHTML = '<p>Trình duyệt của bạn không hỗ trợ chức năng này.</p>';
    maleVoicesList.innerHTML = '<p>Trình duyệt của bạn không hỗ trợ chức năng này.</p>';
    return;
  }
  
  // Lấy danh sách giọng
  const getVoicesList = () => {
    const voices = window.speechSynthesis.getVoices();
    
    // Lọc giọng tiếng Anh
    const englishVoices = voices.filter(voice => 
      voice.lang.includes('en') && !voice.name.includes('Google')
    );
    
    const googleVoices = voices.filter(voice => 
      voice.lang.includes('en') && voice.name.includes('Google')
    );
    
    // Sắp xếp: đặt Google voices lên đầu
    availableVoices = [...googleVoices, ...englishVoices];
    
    if (availableVoices.length === 0) {
      femaleVoicesList.innerHTML = '<p>Không tìm thấy giọng tiếng Anh trên thiết bị của bạn.</p>';
      maleVoicesList.innerHTML = '<p>Không tìm thấy giọng tiếng Anh trên thiết bị của bạn.</p>';
      return;
    }
    
    // Hiển thị danh sách giọng, phân loại theo giới tính
    availableVoices.forEach(voice => {
      const voiceOption = document.createElement('div');
      voiceOption.className = 'voice-option';
      voiceOption.dataset.voiceUri = voice.voiceURI;
      
      // Kiểm tra nếu giọng này đã được chọn
      if (selectedVoice && voice.voiceURI === selectedVoice.voiceURI) {
        voiceOption.classList.add('selected');
      }
      
      // Tên và ngôn ngữ
      const displayName = voice.name.replace(/Google |Microsoft /, '');
      voiceOption.innerHTML = `
        <div class="voice-name">${displayName}</div>
        <div class="voice-lang">${getLanguageName(voice.lang)}</div>
      `;
      
      // Sự kiện click chọn giọng - THÊM TỰ ĐỘNG PHÁT ÂM
      voiceOption.addEventListener('click', function() {
        // Bỏ chọn tất cả
        document.querySelectorAll('.voice-option').forEach(opt => {
          opt.classList.remove('selected');
        });
        
        // Chọn giọng này
        voiceOption.classList.add('selected');
        selectedVoice = voice;
        
        // Lưu lựa chọn
        saveSelectedVoice(voice);
        
        // TỰ ĐỘNG PHÁT ÂM MẪU với giọng vừa chọn
        playSampleVoice(voice);
      });
      
      // Xử lý đặc biệt cho một số giọng cụ thể
      if (voice.name.includes('UK English Female')) {
        femaleVoicesList.appendChild(voiceOption);
      } else if (voice.name.includes('UK English Male')) {
        maleVoicesList.appendChild(voiceOption);
      } 
      // Phân loại còn lại dựa vào hàm phân loại
      else if (isLikelyFemaleVoice(voice.name)) {
        femaleVoicesList.appendChild(voiceOption);
      } else {
        maleVoicesList.appendChild(voiceOption);
      }
    });
  };
  
  // Nếu danh sách giọng đã sẵn sàng
  if (window.speechSynthesis.getVoices().length) {
    getVoicesList();
  } else {
    // Chrome cần thêm sự kiện này
    window.speechSynthesis.onvoiceschanged = getVoicesList;
  }
}

// Thêm hàm phát âm mẫu với giọng cụ thể
function playSampleVoice(voice) {
  if (!('speechSynthesis' in window)) return;
  
  // Dừng phát âm hiện tại nếu có
  window.speechSynthesis.cancel();
  
  // Tạo câu mẫu tùy theo loại giọng nam/nữ
  let sampleText = "Hello, this is a sample of my voice. How does it sound?";
  
  const utterance = new SpeechSynthesisUtterance(sampleText);
  utterance.voice = voice;
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;
  
  // Phát âm
  window.speechSynthesis.speak(utterance);
}

// Đoán giới tính giọng dựa vào tên
function isLikelyFemaleVoice(voiceName) {
  voiceName = voiceName.toLowerCase();
  
  // Kiểm tra chính xác những trường hợp đặc biệt
  if (voiceName.includes('female')) {
    return true;  // Nếu có chứa "female" thì LUÔN là giọng nữ
  }
  
  if (voiceName.includes('male') && !voiceName.includes('female')) {
    return false; // Nếu có chứa "male" (không phải female) thì là giọng nam
  }
  
  // Danh sách các từ khóa chỉ giọng nữ (không bao gồm "female" vì đã xử lý ở trên)
  const femaleIndicators = ['woman', 'girl', 'zira', 'samantha', 'victoria', 'monica', 'linda', 'susan', 'karen', 'lisa', 'amy', 'f)', 'olivia', 'sophia'];
  
  // Danh sách các từ khóa chỉ giọng nam (không bao gồm "male" vì đã xử lý ở trên)
  const maleIndicators = ['man', 'boy', 'm)', 'david', 'mark', 'george', 'richard', 'james', 'daniel', 'john', 'robert', 'paul', 'thomas', 'william'];
  
  // Kiểm tra các từ khóa nữ
  for (const indicator of femaleIndicators) {
    if (voiceName.includes(indicator)) return true;
  }
  
  // Kiểm tra các từ khóa nam
  for (const indicator of maleIndicators) {
    if (voiceName.includes(indicator)) return false;
  }
  
  // Đối với những giọng không xác định rõ, lựa chọn mặc định
  return true; // Mặc định là nữ nếu không xác định được
}

// Lấy tên đầy đủ của ngôn ngữ
function getLanguageName(langCode) {
  const languages = {
    'en-US': 'Tiếng Anh (Mỹ)',
    'en-GB': 'Tiếng Anh (Anh)',
    'en-AU': 'Tiếng Anh (Úc)',
    'en-IN': 'Tiếng Anh (Ấn Độ)',
    'en-CA': 'Tiếng Anh (Canada)',
    'en': 'Tiếng Anh'
  };
  
  return languages[langCode] || langCode;
}

// Lưu giọng đã chọn
function saveSelectedVoice(voice) {
  if (!voice) return;
  
  const voiceData = {
    voiceURI: voice.voiceURI,
    name: voice.name,
    lang: voice.lang
  };
  
  localStorage.setItem('selectedVoice', JSON.stringify(voiceData));
}

// Khôi phục giọng đã chọn
function restoreSelectedVoice() {
  const savedVoice = localStorage.getItem('selectedVoice');
  if (savedVoice) {
    try {
      const voiceData = JSON.parse(savedVoice);
      // Sẽ tìm và đặt giọng sau khi danh sách được tải
      selectedVoice = voiceData;
    } catch (e) {
      console.error('Error parsing saved voice', e);
      selectedVoice = null;
    }
  }
}

// Phát âm với giọng đã chọn
function speakWithSelectedVoice(text) {
  if (!('speechSynthesis' in window)) return;
  
  // Hủy phát âm đang diễn ra
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  
  // Đặt giọng nếu có
  if (selectedVoice) {
    // Tìm giọng trong danh sách giọng hiện tại
    const voices = window.speechSynthesis.getVoices();
    const matchingVoice = voices.find(v => v.voiceURI === selectedVoice.voiceURI);
    
    if (matchingVoice) {
      utterance.voice = matchingVoice;
    } else if (selectedVoice.name && selectedVoice.lang) {
      // Tìm theo tên và ngôn ngữ nếu không tìm thấy theo URI
      const alternateVoice = voices.find(v => 
        v.name === selectedVoice.name && v.lang === selectedVoice.lang
      );
      
      if (alternateVoice) {
        utterance.voice = alternateVoice;
      }
    }
  }
  
  // Đặt ngôn ngữ và tốc độ
  utterance.lang = 'en-US';
  utterance.rate = 1.0;
  
  // Phát âm
  window.speechSynthesis.speak(utterance);
}

// 1. Hàm tạo bộ lọc trạng thái học tập thay thế ô tìm kiếm
function createLearningStatusFilter() {
  // Tìm phần tử chứa ô tìm kiếm
  const searchContainer = document.querySelector('.search-box');
  if (!searchContainer) return;
  
  // Tạo container mới cho bộ lọc
  const filterContainer = document.createElement('div');
  filterContainer.className = 'learning-status-filter';
  
  // Tạo HTML cho bộ lọc với icon phù hợp và tối ưu hóa
  filterContainer.innerHTML = `
    <button class="status-filter-btn active" data-status="all">
      <i class="fas fa-layer-group"></i> Tất Cả
    </button>
    <button class="status-filter-btn" data-status="learned">
      <i class="fas fa-check-circle"></i> Đã Học
    </button>
    <button class="status-filter-btn" data-status="unlearned">
      <i class="fas fa-book-open"></i> Chưa Học
    </button>
  `;
  
  // Thay thế ô tìm kiếm bằng bộ lọc mới
  searchContainer.parentNode.replaceChild(filterContainer, searchContainer);
  
  // Thêm sự kiện cho các nút trong bộ lọc
  const statusButtons = filterContainer.querySelectorAll('.status-filter-btn');
  statusButtons.forEach(btn => {
    btn.addEventListener('click', function() {
      // Cập nhật trạng thái active
      statusButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      // Lấy trạng thái từ data attribute
      currentLearningStatus = btn.dataset.status;
      
      // Áp dụng bộ lọc kết hợp (trạng thái học + danh mục)
      applyFilters();
    });
  });
}

// 3. Hàm lọc kết hợp (trạng thái học + danh mục)
function applyFilters() {
  // Lọc dựa trên danh mục
  let filteredByCategory = currentCategory === 'all' ? 
    [...allPhrases] : 
    allPhrases.filter(phrase => phrase.category === currentCategory);
  
  // Luôn trộn ngẫu nhiên kết quả
  filteredByCategory = shuffleArray([...filteredByCategory]);
  
  // Lọc tiếp theo trạng thái học
  let result = filteredByCategory;
  
  if (currentLearningStatus === 'learned') {
    result = filteredByCategory.filter(phrase => learnedPhrases.includes(phrase.id));
  } else if (currentLearningStatus === 'unlearned') {
    result = filteredByCategory.filter(phrase => !learnedPhrases.includes(phrase.id));
  }
  
  // Cập nhật danh sách hiện tại và hiển thị
  currentPhrases = result;
  currentPage = 1; // Reset về trang đầu
  
  // Hiển thị kết quả
  displayPhrases(currentPhrases);
  
  // Hiệu ứng cho việc thay đổi bộ lọc
  addFilterChangeEffect();
}
