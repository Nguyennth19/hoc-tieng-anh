<style>
/* Part 4 only: all Home hero/stats/search/cards/buttons inherit Styles_Speaking.html. */
.speaking-shell.p4-mode > :not(.bottom-nav):not(.skill-page-head):not(.shared-part-switch):not(#speakingPart4Future){display:none!important}
.speaking-shell.p4-mode .skill-page-head{display:flex!important}
.speaking-shell .part-switch{grid-template-columns:repeat(4,minmax(0,1fr))}
.speaking-shell .part-switch .part-tab{min-width:0}
.speaking-shell .shared-part-switch{display:none;width:min(calc(100% - 32px),var(--max));margin:12px auto 16px;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.speaking-shell:has(#homeView:not(.hidden)) .shared-part-switch,.speaking-shell.p4-mode .shared-part-switch{display:grid!important}
.speaking-shell .shared-part-switch [data-p4-home].active{background:var(--purple-soft);border-color:#ded9fb;color:var(--purple-2)}
.speaking-shell.p4-mode #speakingPart4Future.p4dev{width:min(calc(100% - 32px),var(--max));max-width:none;margin:0 auto;padding:0 0 100px;color:var(--ink);font-family:inherit}
.p4dev.hidden,.p4dev [hidden]{display:none!important}
.p4dev .p4-topic-library,.p4dev .p4-topic-detail{width:100%;max-width:none;margin:0;padding:0}
.p4dev .welcome-card,.p4dev .today-section,.p4dev .library-section{width:100%}

.p4dev .p4-topic-card{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);align-items:start;gap:12px;text-align:left;min-height:90px;padding:14px;border:1px solid var(--border);border-radius:18px;background:var(--card);box-shadow:0 4px 14px rgba(48,68,124,.035);color:var(--ink);cursor:pointer}

.p4dev .p4-topic-card-copy{display:flex;flex-direction:column;gap:6px;min-width:0}
.p4dev .p4-topic-card-copy strong{font-size:15px;line-height:1.4}
.p4dev .p4-topic-card-copy span{font-size:12px;color:var(--muted)}
.p4dev .p4-topic-card:hover{border-color:var(--purple)}
.p4dev button:focus-visible,.p4dev select:focus-visible{outline:3px solid var(--purple);outline-offset:2px}

.p4dev .p4-topic-navigation #p4BackLibrary{margin-right:auto}
.p4dev .p4-topic-navigation #p4TopicPosition{font-size:13px;color:var(--muted)}
.p4dev .p4-topic-detail{background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:clamp(16px,3vw,28px)}
.p4dev .p4-topic-heading{margin:0 0 16px}
.p4dev .p4-topic-heading .p4-topic-meta span{display:inline-flex;border-radius:999px;background:var(--purple-soft);color:var(--purple-2);padding:5px 11px;font-size:12px;font-weight:700}
.p4dev .p4-topic-heading h3{font-size:clamp(24px,3vw,32px);margin:10px 0;color:var(--ink)}
.p4dev .p4-study-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;background:#e9ecf3;border-radius:15px;padding:5px;margin:0 0 16px}
.p4dev .p4-step-btn{border:0;border-radius:12px;min-width:0;padding:13px 6px;background:transparent;color:var(--muted);font-weight:800}
.p4dev .p4-step-btn.active{background:#fff;color:var(--purple-2);box-shadow:var(--shadow-soft)}
.p4dev .p4-internal-controls,.p4dev #p4MasteryOverview{display:none!important}
.p4dev .p4-tools-disclosure{border:1px solid var(--border);border-radius:12px;background:#fafaff;margin:8px 0 18px}
.p4dev .p4-tools-disclosure>summary{cursor:pointer;padding:12px 15px;color:var(--purple-2);font-size:13px;font-weight:700}
.p4dev .p4-learning-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px}
.p4dev .p4-learning-tools select,.p4dev .p4-learning-tools button{min-width:0;width:100%}
.p4dev #p4MasterySaved{grid-column:1/-1}
.p4dev .p4-feedback:empty{display:none!important}
.p4dev .p4dev-content{display:grid;gap:14px}
.p4dev .p4dev-question{padding:20px;background:#fff;border:1px solid var(--border);border-radius:19px}
.p4dev .p4dev-question>b{font-size:13px;color:var(--purple-2)}
.p4dev .p4dev-prompt{font-size:clamp(17px,2vw,21px);font-weight:750;line-height:1.5;color:var(--ink)}
.p4dev .p4dev-inline-answer{border-top:1px solid var(--border);padding-top:12px}
.p4dev .p4dev-inline-answer summary{cursor:pointer;color:var(--purple-2);font-weight:700}
.p4dev .p4dev-inline-answer p{line-height:1.8;color:var(--ink)}
.p4dev .p4-listen{border:1px solid #ded8ff;border-radius:11px;padding:10px 12px;color:var(--purple-2);background:var(--purple-soft)}
.p4-fixed-formula{color:#c45c08!important;font-weight:800}
.p4-hidden-slot,.p4-recall-prompt{font-style:italic;color:var(--muted)}
.p4dev .p4dev-time{position:sticky;bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:14px;background:var(--purple-soft);border:1px solid #ded9fb;border-radius:18px;margin-top:16px;z-index:2}
.p4dev .p4dev-time strong{font-size:26px;color:var(--purple-2);font-variant-numeric:tabular-nums;margin-left:auto}
.p4dev .p4dev-time button,.p4dev .p4-topic-navigation button,.p4dev .p4-learning-tools button{padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}
.p4dev .p4dev-time button:disabled{opacity:.5;cursor:not-allowed}
.p4dev #p4Begin,.p4dev #p4Save{background:var(--purple);color:#fff;border-color:transparent}
.p4dev #p4Review{padding:16px;border:1px solid var(--border);border-radius:18px;background:#fff;margin-top:14px}
.p4dev .p4dev-disclaimer{font-size:12px;color:var(--muted);margin:16px 0 35px}
@media(max-width:650px){.speaking-shell .shared-part-switch,.speaking-shell.p4-mode #speakingPart4Future.p4dev{width:calc(100% - 20px)}.speaking-shell .shared-part-switch{gap:5px}.speaking-shell .shared-part-switch .part-tab{padding:8px 5px}.speaking-shell .shared-part-switch .part-tab small{font-size:10px}.p4dev .p4-topic-grid{grid-template-columns:1fr}.p4dev .p4-topic-navigation #p4BackLibrary{width:100%;text-align:left}.p4dev .p4-learning-tools{grid-template-columns:1fr}.p4dev .p4dev-time{position:relative;bottom:auto}}
</style>
