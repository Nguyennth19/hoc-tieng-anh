<style>
:root{
  --font:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;
  --bg:#f6f7fb;
  --card:#ffffff;
  --ink:#27314d;
  --muted:#667085;
  --border:#e3e7ef;
  --purple:#7161ff;
  --purple-2:#6253ee;
  --purple-soft:#efecff;
  --blue:#4c8cff;
  --blue-soft:#edf4ff;
  --green:#49b26f;
  --green-soft:#eaf8ef;
  --gold:#d6aa19;
  --gold-soft:#fff4c8;
  --rose:#df5470;
  --rose-soft:#fff0f4;
  --teal:#3ea8a0;
  --teal-soft:#eaf9f7;
  --shadow:0 12px 32px rgba(48,68,124,.08);
  --shadow-soft:0 7px 18px rgba(48,68,124,.055);
  --radius-xl:24px;
  --radius-lg:19px;
  --radius-md:15px;
  --max:1120px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}.hidden{display:none!important}
.app-shell{min-height:100vh;padding-bottom:94px}
.topbar{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;min-height:66px;padding:9px max(14px,calc((100vw - var(--max))/2));background:rgba(246,247,251,.96);border-bottom:1px solid rgba(227,231,239,.9);backdrop-filter:blur(16px)}
.brand-wrap,.top-actions,.block-row,.study-topline,.study-meta,.study-footer,.inline-actions,.welcome-actions,.section-title-row,.library-controls,.study-top-actions{display:flex;align-items:center}
.brand-wrap{gap:10px}.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,var(--purple),#8a7cff);color:#fff;font-size:13px;font-weight:900;letter-spacing:-.03em;box-shadow:0 8px 18px rgba(113,97,255,.22)}
.topbar h1{margin:1px 0 0;font-size:18px;font-weight:900;letter-spacing:-.025em}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.13em;color:#8a94a7}.top-actions{gap:7px}
.icon-btn{width:44px;height:44px;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:14px;display:grid;place-items:center;box-shadow:var(--shadow-soft);font-weight:900;font-size:17px}
.icon-btn:active,.primary-btn:active,.secondary-btn:active,.success-btn:active,.focus-card:active,.question-item:active{transform:translateY(1px)}</style>
